---
id: https://w3id.org/ber-data/bridge-central-schema
name: ber-central-schema
title: BRIDGE Central Schema
description: >-
  The central BRIDGE schema for harmonized cross-BER data access. Defines
  shared base elements and composes domain modules (currently:
  core.yaml, measurements.yaml and samples.yaml).
license: Apache-2.0
comments:
  - >-
    Root classes and mixins (Thing, NamedThing, Identified, Measurable) are
    in core.yaml. Standards consulted for them and for Sample, each cited
    where it is used: entity-relationship modeling (Chen 1976), Biolink
    Model, W3C SOSA/SSN, ISO 19156 Observations, measurements and samples,
    ODM2, iSamples, the ESS-DIVE sample ID and metadata reporting format,
    the Darwin Core Data Package, PROV-O and OBI.
see_also:
  - https://github.com/doe-bridge/bridge-central-schema
  - https://github.com/doe-bridge/lakehouse-registry

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types
  - core
  - measurements
  - samples
