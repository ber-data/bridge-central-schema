---
id: https://w3id.org/ber-data/bridge-central-schema
name: ber-central-schema
title: BRIDGE Central Schema
description: >-
  The central BRIDGE schema for harmonized cross-BER data access. Defines
  shared base elements and composes domain modules (currently:
  measurements.yaml, biological_context.yaml, treatments.yaml).
license: Apache-2.0
see_also:
  - https://github.com/doe-bridge/bridge-central-schema
  - https://github.com/doe-bridge/lakehouse-registry

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  # Used by enum meanings in the biological_context module; the Python
  # generator only emits namespaces for prefixes declared in this root
  # schema.
  GENO: http://purl.obolibrary.org/obo/GENO_
  EFO: http://www.ebi.ac.uk/efo/EFO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  PCO: http://purl.obolibrary.org/obo/PCO_
  biolink: https://w3id.org/biolink/vocab/
default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types
  - measurements
  - treatments
  - biological_context

classes:

  NamedThing:
    class_uri: schema:Thing
    description: Generic base for any identifiable BRIDGE entity.
    slots:
      - id
      - name
      - description

slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing
  name:
    slot_uri: schema:name
    description: A human-readable name for a thing
  description:
    slot_uri: schema:description
    description: A human-readable description for a thing
