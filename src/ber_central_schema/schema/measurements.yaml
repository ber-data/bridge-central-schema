id: https://w3id.org/ber-data/bridge-measurements
name: measurements
title: BRIDGE Measurements Module
description: >-
  First-pass union model for BRIDGE measurement metadata, built from the
  2026-09-30 BRIDGE Measurements hackathon. One Measurement class holds one
  value of one property, keeps the source text, and adds structured parts
  (number, range, unit, statistic, qualifier, missing-value reason) only when
  the source supports them. See docs/measurements-hackathon-2026-09-30.md for
  what was raised at the hackathon and where each item went.
license: BSD-3
version: 0.3.0

prefixes:
  bridge: https://w3id.org/ber-data/bridge-measurements/
  linkml: https://w3id.org/linkml/
  bervo: https://w3id.org/bervo/
  nmdc: https://w3id.org/nmdc/
  sosa: http://www.w3.org/ns/sosa/
  METPO: https://w3id.org/metpo/
  MIXS: https://w3id.org/mixs/
  gold: "https://bioregistry.io/gold:"
  bridge_property: https://w3id.org/ber-data/bridge-property/

default_prefix: bridge
default_range: string

imports:
  - linkml:types

classes:

  Measurement:
    description: >-
      One value of one property of one thing, as reported by a source. A
      measurement may carry a number with a unit, a range, a summary
      statistic, a categorical term, or only the source text, and it may say
      why no value is present. The 2026-09-30 hackathon chose to start with
      this single class and add an Observation class only when data shows a
      need for one.
    close_mappings:
      - sosa:Observation
      - nmdc:QuantityValue
    slots:
      - measurement_id
      - observed_property
      - property_label
      - feature_of_interest
      - raw_value
      - numeric_value
      - minimum_numeric_value
      - maximum_numeric_value
      - unit
      - value_term
      - comparator
      - statistic
      - standard_deviation
      - sample_size
      - value_role
      - value_qualifier
      - missing_value_reason
      - measurement_method
      - instrument
      - observed_time
      - source_system
      - source_record_id
      - source_field
      - quality_flag
    slot_usage:
      observed_property:
        recommended: true
      raw_value:
        recommended: true
    exactly_one_of:
      - slot_conditions:
          observed_property:
            required: true
      - slot_conditions:
          property_label:
            required: true
    any_of:
      - slot_conditions:
          raw_value:
            required: true
      - slot_conditions:
          numeric_value:
            required: true
      - slot_conditions:
          minimum_numeric_value:
            required: true
      - slot_conditions:
          maximum_numeric_value:
            required: true
      - slot_conditions:
          value_term:
            required: true
      - slot_conditions:
          missing_value_reason:
            required: true
    comments:
      - >-
        A record must carry at least one of raw_value, numeric_value,
        minimum_numeric_value, maximum_numeric_value, value_term or
        missing_value_reason, so an empty measurement fails validation.
      - >-
        A record names its property with exactly one of observed_property (an
        identifier) or property_label (free text). property_label is the
        catch-all for values whose property has no identifier yet, as MIxS
        misc_param, NMDC PropertyAssertion and BERtron Attribute allow.
      - >-
        A source cell that holds several values (for example a width and a
        length) becomes several Measurement records that share source_record_id
        and source_field.

slots:

  measurement_id:
    range: uriorcurie
    description: >-
      An identifier for this measurement, when the source has one or BRIDGE
      mints one on ingest. Optional, because many sources (ESS-DIVE among
      them) do not identify individual measurements.

  observed_property:
    range: uriorcurie
    description: >-
      The property that was measured. Use a BERVO term when BERVO has one;
      otherwise a BRIDGE-issued property identifier. Correspondences to MIxS
      and other vocabularies are recorded in
      mappings/observed_property.sssom.tsv, not here.
    exact_mappings:
      - sosa:observedProperty
    aliases:
      - measurement_type
      - variable

  property_label:
    description: >-
      The name of the measured property as free text, for values whose
      property has no BERVO or BRIDGE identifier yet. Use observed_property
      instead whenever an identifier exists.
    close_mappings:
      - nmdc:has_attribute_label
      - MIXS:0000752

  feature_of_interest:
    range: uriorcurie
    description: >-
      A reference to the thing whose property was measured: a sample, an
      organism, a site or plot, a stream. Only a reference: the classes for
      those things belong to the Project/Sample/Study/Processing working
      group.
    exact_mappings:
      - sosa:hasFeatureOfInterest

  raw_value:
    description: >-
      The value exactly as it appeared at the source, including its unit text,
      ranges, qualifiers and any non-ASCII characters. Never edited.
    close_mappings:
      - nmdc:has_raw_value

  numeric_value:
    range: double
    description: A single number parsed from the source value.
    close_mappings:
      - nmdc:has_numeric_value

  minimum_numeric_value:
    range: double
    description: The lower end of a range, or the lower bound of a one-sided value.
    close_mappings:
      - nmdc:has_minimum_numeric_value

  maximum_numeric_value:
    range: double
    description: The upper end of a range, or the upper bound of a one-sided value.
    close_mappings:
      - nmdc:has_maximum_numeric_value

  unit:
    description: >-
      The unit as a UCUM code, written in printable ASCII (for example um, not
      µm). Leave empty for values without a unit, such as pH. The source's own
      spelling stays in raw_value.
    pattern: "^[!-~]+$"
    close_mappings:
      - nmdc:has_unit

  value_term:
    range: uriorcurie
    description: >-
      An ontology term for a categorical value, such as METPO:1000615
      (mesophilic). The source wording stays in raw_value.

  comparator:
    range: ComparatorEnum
    description: >-
      How the true value relates to numeric_value, for values reported as
      above or below a number, such as below a detection limit.

  statistic:
    range: StatisticEnum
    description: >-
      The summary statistic that numeric_value reports, when the source value
      summarizes several readings or individuals.

  standard_deviation:
    range: double
    minimum_value: 0
    description: The standard deviation reported with a mean, in the same unit.

  sample_size:
    range: integer
    minimum_value: 1
    description: How many readings, replicates or individuals a statistic summarizes.

  value_role:
    range: ValueRoleEnum
    description: >-
      Whether the value was measured, set as an experimental condition, or
      assigned by a person interpreting other measurements.

  value_qualifier:
    range: ValueQualifierEnum
    description: >-
      A qualifier the source attaches to the value, such as an optimum
      (optimal growth at 10 MPa).

  missing_value_reason:
    range: MissingValueReasonEnum
    description: >-
      Why no usable value is present. Sources often write these as text (not
      determined) or as sentinel numbers (-9999); record the source text in
      raw_value.

  measurement_method:
    description: >-
      How the value was obtained: a protocol name, a method reference, or the
      source's companion method field (for example an NMDC ph_meth value).
    close_mappings:
      - sosa:usedProcedure

  instrument:
    description: The instrument or sensor that produced the value.
    close_mappings:
      - sosa:madeBySensor

  observed_time:
    range: datetime
    description: >-
      When the property was observed, as an ISO 8601 date-time with a UTC
      offset.
    close_mappings:
      - sosa:phenomenonTime

  source_system:
    description: The system the value came from, such as GOLD, NMDC, BASALT or ESS-DIVE.

  source_record_id:
    description: The identifier of the source record the value came from.

  source_field:
    description: The source field, column or slot the value came from.

  quality_flag:
    description: >-
      A flag from the source or from BRIDGE curation, such as needs_review for
      a value that could not be parsed.

enums:

  ComparatorEnum:
    description: How a reported number relates to the true value.
    permissible_values:
      less_than:
        description: The true value is below numeric_value.
      less_than_or_equal:
        description: The true value is at or below numeric_value.
      greater_than:
        description: The true value is above numeric_value.
      greater_than_or_equal:
        description: The true value is at or above numeric_value.
      approximately:
        description: The source gave numeric_value as an approximation.

  StatisticEnum:
    description: Summary statistics a measurement value can report.
    permissible_values:
      mean:
        description: The arithmetic mean of the readings or individuals.
      median:
        description: The median of the readings or individuals.
      minimum:
        description: The smallest of the readings or individuals.
      maximum:
        description: The largest of the readings or individuals.
      standard_deviation:
        description: >-
          numeric_value is itself a standard deviation, for sources that report
          it as its own record.
      sum:
        description: The total of the readings, such as a daily precipitation total.

  ValueRoleEnum:
    description: How a value came to be recorded.
    permissible_values:
      measured:
        description: The value was measured.
      setting:
        description: >-
          The value was set as an experimental condition, for example growth at
          5 degrees Celsius for 2 hours.
      interpreted:
        description: >-
          A person assigned the value after interpreting other measurements,
          for example a strain labelled mesophilic.
      derived:
        description: >-
          The value was computed from other values, for example a projected
          shoot area calculated from a pixel count and an image scale.

  ValueQualifierEnum:
    description: Qualifiers a source attaches to a value.
    permissible_values:
      optimum:
        description: The value at which a process (usually growth) is best.
      tolerated:
        description: A value or range within which a process can occur.

  MissingValueReasonEnum:
    description: Reasons a measurement has no usable value.
    permissible_values:
      not_determined:
        description: The source says the value was not determined.
      not_applicable:
        description: The property does not apply to this thing.
      not_reported:
        description: The source has no value and gives no reason.
      below_detection_limit:
        description: The value was below the method's detection limit.
      above_detection_limit:
        description: The value was above the method's upper detection limit.
      out_of_range:
        description: >-
          The source used a sentinel value meaning the reading was outside the
          instrument's range.
