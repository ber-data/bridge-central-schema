id: https://w3id.org/ber-data/bridge-measurements
name: measurements
title: BRIDGE Measurements Module
description: Stub classes for the unified BRIDGE measurement model.
license: BSD-3
version: 0.2.0

prefixes:
  bridge: https://w3id.org/ber-data/bridge-measurements/
  linkml: https://w3id.org/linkml/
  bervo: https://w3id.org/bervo/
  nmdc: https://w3id.org/nmdc/
  sosa: http://www.w3.org/ns/sosa/

default_prefix: bridge
default_range: string

imports:
  - linkml:types

classes:

  AttributeValue:
    abstract: true
    description: The value of an attribute.
    exact_mappings:
      - nmdc:AttributeValue
    slots:
      - raw_value

  QuantityValue:
    is_a: AttributeValue
    description: A numeric value with a unit.
    exact_mappings:
      - nmdc:QuantityValue
    slots:
      - numeric_value
      - unit

  Observation:
    description: >-
      An act of observing a property of a feature of interest, yielding a
      result (OGC O&M / SOSA shape).
    exact_mappings:
      - sosa:Observation
    slots:
      - observed_property
      - feature_of_interest
      - result

  Measurement:
    is_a: Observation
    description: An observation whose result is a quantity.
    slot_usage:
      result:
        range: QuantityValue

slots:

  observed_property:
    range: uriorcurie
    description: The property observed; a BERVO Variable CURIE when one exists.

  feature_of_interest:
    range: uriorcurie
    description: The entity the property was observed on.

  result:
    range: AttributeValue
    inlined: true
    description: The result of the observation.

  raw_value:
    description: The value exactly as it appeared at the source.

  numeric_value:
    range: double

  unit:
    description: UCUM code preferred.
