name: ber-central-schema
description: 'The central BRIDGE schema for harmonized cross-BER data access. Defines
  shared base elements and composes domain modules (currently: measurements.yaml).'
title: BRIDGE Central Schema
see_also:
- https://github.com/ber-data/bridge-central-schema
- https://github.com/ber-data/lakehouse-registry
id: https://w3id.org/ber-data/bridge-central-schema
imports:
- linkml:types
- measurements
license: Apache-2.0
prefixes:
  bridge_central_schema:
    prefix_prefix: bridge_central_schema
    prefix_reference: https://w3id.org/ber-data/bridge-central-schema/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
default_prefix: bridge_central_schema
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
slots:
  id:
    name: id
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/id
    description: A unique identifier for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: NamedThing
    domain_of:
    - NamedThing
    range: uriorcurie
    required: true
  name:
    name: name
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/name
    description: A human-readable name for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/description
    description: A human-readable description for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  observed_property:
    name: observed_property
    definition_uri: https://w3id.org/ber-data/bridge-measurements/observed_property
    description: The property observed; a BERVO Variable CURIE when one exists.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:observed_property
    owner: Observation
    domain_of:
    - Observation
    range: uriorcurie
  feature_of_interest:
    name: feature_of_interest
    definition_uri: https://w3id.org/ber-data/bridge-measurements/feature_of_interest
    description: The entity the property was observed on.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:feature_of_interest
    owner: Observation
    domain_of:
    - Observation
    range: uriorcurie
  result:
    name: result
    definition_uri: https://w3id.org/ber-data/bridge-measurements/result
    description: The result of the observation.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:result
    owner: Observation
    domain_of:
    - Observation
    range: AttributeValue
    inlined: true
    inlined_as_list: true
  raw_value:
    name: raw_value
    definition_uri: https://w3id.org/ber-data/bridge-measurements/raw_value
    description: The value exactly as it appeared at the source.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:raw_value
    owner: AttributeValue
    domain_of:
    - AttributeValue
    range: string
  numeric_value:
    name: numeric_value
    definition_uri: https://w3id.org/ber-data/bridge-measurements/numeric_value
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:numeric_value
    owner: QuantityValue
    domain_of:
    - QuantityValue
    range: double
  unit:
    name: unit
    definition_uri: https://w3id.org/ber-data/bridge-measurements/unit
    description: UCUM code preferred.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:unit
    owner: QuantityValue
    domain_of:
    - QuantityValue
    range: string
  Measurement_result:
    name: Measurement_result
    definition_uri: https://w3id.org/ber-data/bridge-measurements/result
    description: The result of the observation.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: result
    domain: Measurement
    slot_uri: bridge:result
    alias: result
    owner: Measurement
    domain_of:
    - Measurement
    is_usage_slot: true
    usage_slot_name: result
    range: QuantityValue
    inlined: true
    inlined_as_list: true
classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/NamedThing
    description: Generic base for any identifiable BRIDGE entity.
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:Thing
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  AttributeValue:
    name: AttributeValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/AttributeValue
    description: The value of an attribute.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - nmdc:AttributeValue
    abstract: true
    slots:
    - raw_value
    class_uri: bridge:AttributeValue
  QuantityValue:
    name: QuantityValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/QuantityValue
    description: A numeric value with a unit.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - nmdc:QuantityValue
    is_a: AttributeValue
    slots:
    - raw_value
    - numeric_value
    - unit
    class_uri: bridge:QuantityValue
  Observation:
    name: Observation
    definition_uri: https://w3id.org/ber-data/bridge-measurements/Observation
    description: An act of observing a property of a feature of interest, yielding
      a result (OGC O&M / SOSA shape).
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - sosa:Observation
    slots:
    - observed_property
    - feature_of_interest
    - result
    class_uri: bridge:Observation
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/ber-data/bridge-measurements/Measurement
    description: An observation whose result is a quantity.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: Observation
    slots:
    - observed_property
    - feature_of_interest
    - Measurement_result
    slot_usage:
      result:
        name: result
        range: QuantityValue
    class_uri: bridge:Measurement
metamodel_version: 1.11.0
