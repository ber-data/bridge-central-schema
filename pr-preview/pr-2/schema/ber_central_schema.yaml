classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/NamedThing
    description: 'Generic base for any identifiable BRIDGE entity. Aligns with the
      id/name/description root shared by twelve BER schemas (harmonization row: "Base
      / named entity"). Domain classes in future modules (samples, sites, datasets)
      should derive from this; the measurements module keeps its classes thin and
      points at NamedThing-derived entities via uriorcurie slots.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:Thing
    slots:
    - id
    - type
    - name
    - description
    class_uri: schema:Thing
  BridgeDatabase:
    name: BridgeDatabase
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/BridgeDatabase
    description: 'Top-level container for a BRIDGE data exchange document: holds the
      vocabulary (observed properties, source-term crosswalk) alongside the measurement
      rows and their run-level groupings.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    slots:
    - bridgeDatabase__observed_properties
    - bridgeDatabase__source_term_mappings
    - bridgeDatabase__measurement_collections
    - bridgeDatabase__measurements
    attributes:
      observed_properties:
        name: observed_properties
        range: ObservedProperty
        multivalued: true
        inlined_as_list: true
      source_term_mappings:
        name: source_term_mappings
        range: SourceTermMapping
        multivalued: true
        inlined_as_list: true
      measurement_collections:
        name: measurement_collections
        range: MeasurementCollection
        multivalued: true
        inlined_as_list: true
      measurements:
        name: measurements
        range: Measurement
        multivalued: true
        inlined_as_list: true
    class_uri: ber_central_schema:BridgeDatabase
    tree_root: true
  ObservedProperty:
    name: ObservedProperty
    definition_uri: https://w3id.org/ber-data/bridge-measurements/ObservedProperty
    description: 'A measurable/observable property descriptor: the "what was measured".
      When a BERVO Variable term exists, id SHOULD be the BERVO CURIE and the descriptor
      slots (measurement_of, measured_in, canonical_unit, value_type) SHOULD agree
      with BERVO''s pre-coordinated annotations (bervo:BERVO_measurement_of, bervo:BERVO_measured_in,
      bervo:BERVO_has_unit, bervo:BERVO_has_value_type). When no BERVO term exists
      yet, an ObservedProperty may be minted with a source-native or bridge-local
      id and the same descriptor slots; these are the candidate terms to push upstream
      into BERVO.'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    mappings:
    - sosa:ObservableProperty
    exact_mappings:
    - bervo:BERVO_0000000
    slots:
    - observedProperty__id
    - observedProperty__label
    - observedProperty__description
    - observedProperty__categories
    - observedProperty__measurement_of
    - observedProperty__measured_in
    - observedProperty__canonical_unit
    - observedProperty__value_type
    - observedProperty__source_vocabulary
    - observedProperty__mappings
    attributes:
      id:
        name: id
        description: BERVO CURIE preferred; else source vocabulary CURIE or bridge-minted
          id.
        identifier: true
        range: uriorcurie
      label:
        name: label
        description: Human-readable name, e.g. "Nitrate", "Soil respiration".
        required: true
      description:
        name: description
        range: string
      categories:
        name: categories
        description: Classification path in priority order (BASIN-3D style), e.g.
          ["Biogeochemistry", "Anions"]. Use BERVO upper-level variable branches (e.g.
          "Soil biogeochemistry variable") when possible.
        multivalued: true
      measurement_of:
        name: measurement_of
        description: The entity or quality quantified, e.g. a CHEBI analyte or PATO
          quality. Mirrors bervo:BERVO_measurement_of.
        range: uriorcurie
      measured_in:
        name: measured_in
        description: The medium/compartment the property is characteristically measured
          in (e.g. ENVO or BERVO context term). Mirrors bervo:BERVO_measured_in.
        range: uriorcurie
      canonical_unit:
        name: canonical_unit
        description: Preferred reporting unit as a UCUM code, e.g. "mg/L", "Cel",
          "umol/L".
        exact_mappings:
        - qudt:unit
      value_type:
        name: value_type
        description: Whether values are quantitative or qualitative. Mirrors bervo:BERVO_has_value_type.
        range: ValueTypeEnum
      source_vocabulary:
        name: source_vocabulary
        description: The vocabulary this term originates from, e.g. "BERVO", "MIxS",
          "USGS-PCode", "BASALT-column".
      mappings:
        name: mappings
        description: Cross-vocabulary equivalents, e.g. MIXS:0000425, USGS parameter
          codes as CURIEs.
        range: uriorcurie
        multivalued: true
    class_uri: sosa:ObservableProperty
  SourceTermMapping:
    name: SourceTermMapping
    definition_uri: https://w3id.org/ber-data/bridge-measurements/SourceTermMapping
    description: 'A crosswalk row binding one data source''s native term to BRIDGE
      vocabulary, generalizing BASIN-3D''s AttributeMapping. One source code may set
      several BRIDGE attributes at once (compound mapping): USGS parameter 00010 ("Temperature,
      water") maps to observed_property=water temperature AND sampling_medium=WATER.
      Maintained per data source as mapping tables; many-to-one is expected (e.g.
      ESS-DIVE Gage_Height and Water_Depth both map to one water-level property).'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slots:
    - sourceTermMapping__datasource
    - sourceTermMapping__source_term
    - sourceTermMapping__source_term_description
    - sourceTermMapping__observed_property
    - sourceTermMapping__sampling_medium
    - sourceTermMapping__statistic
    - sourceTermMapping__aggregation_duration
    - sourceTermMapping__quality_status
    - sourceTermMapping__unit
    attributes:
      datasource:
        name: datasource
        description: Identifier of the contributing source, e.g. "nmdc", "basalt",
          "usgs", "essdive".
        required: true
      source_term:
        name: source_term
        description: 'The source''s native code exactly as it appears in the data:
          a USGS parameter code ("00010"), an NMDC slot_uri (MIXS:0000425), a BASALT
          column name ("total_carbon"), a FLUXNET variable ("FC").'
        required: true
      source_term_description:
        name: source_term_description
        description: The source's own description of the term.
      observed_property:
        name: observed_property
        description: The BRIDGE observed property this source term maps to.
        range: ObservedProperty
        inlined: false
      sampling_medium:
        name: sampling_medium
        range: SamplingMediumEnum
      statistic:
        name: statistic
        range: StatisticEnum
      aggregation_duration:
        name: aggregation_duration
        range: AggregationDurationEnum
      quality_status:
        name: quality_status
        range: ResultQualityStatusEnum
      unit:
        name: unit
        description: UCUM unit implied by the source term when the source encodes
          units in the term/column name.
    class_uri: bridge:SourceTermMapping
  MeasurementValue:
    name: MeasurementValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/MeasurementValue
    description: 'Polymorphic result holder. Harmonizes the two BER naming families
      for value objects: plain (lambda/aims-leaf/BERtron/CDM: value, unit) and NMDC/BASALT
      has_* (has_numeric_value, has_unit). This schema uses the plain family and declares
      exact_mappings to the NMDC slots so the crosswalk is mechanical.'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    abstract: true
    slots:
    - type
    - raw_value
    class_uri: bridge:MeasurementValue
  QuantityValue:
    name: QuantityValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/QuantityValue
    description: A scalar or range numeric result with a unit.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - schema:QuantityValue
    - nmdc:QuantityValue
    is_a: MeasurementValue
    slots:
    - type
    - raw_value
    - quantityValue__numeric_value
    - quantityValue__minimum_numeric_value
    - quantityValue__maximum_numeric_value
    - quantityValue__unit
    attributes:
      numeric_value:
        name: numeric_value
        description: The value; for ranges, use minimum/maximum instead or additionally
          (midpoint).
        exact_mappings:
        - nmdc:has_numeric_value
        - qudt:quantityValue
        - schema:value
        range: double
      minimum_numeric_value:
        name: minimum_numeric_value
        exact_mappings:
        - nmdc:has_minimum_numeric_value
        range: double
      maximum_numeric_value:
        name: maximum_numeric_value
        exact_mappings:
        - nmdc:has_maximum_numeric_value
        range: double
      unit:
        name: unit
        description: UCUM code strongly preferred (seed the future BRIDGE UnitEnum
          from NMDC UnitEnum's ~109 UCUM codes). BASALT free-string units and column-name
          unit suffixes normalize into this slot.
        exact_mappings:
        - nmdc:has_unit
        - qudt:unit
        - schema:unitCode
    class_uri: bridge:QuantityValue
  ControlledTermValue:
    name: ControlledTermValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/ControlledTermValue
    description: A categorical result drawn from an ontology or controlled vocabulary.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: MeasurementValue
    slots:
    - type
    - raw_value
    - controlledTermValue__term_id
    - controlledTermValue__term_label
    attributes:
      term_id:
        name: term_id
        description: e.g. a PATO, ENVO, or CHEBI CURIE.
        exact_mappings:
        - nmdc:has_value_term_id
        range: uriorcurie
      term_label:
        name: term_label
        range: string
    class_uri: bridge:ControlledTermValue
  TextValue:
    name: TextValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/TextValue
    description: A free-text result; the fallback when nothing more structured applies.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: MeasurementValue
    slots:
    - type
    - raw_value
    - textValue__text_value
    - textValue__language
    attributes:
      text_value:
        name: text_value
        range: string
      language:
        name: language
        range: string
    class_uri: bridge:TextValue
  BooleanValue:
    name: BooleanValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/BooleanValue
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: MeasurementValue
    slots:
    - type
    - raw_value
    - booleanValue__boolean_value
    attributes:
      boolean_value:
        name: boolean_value
        range: boolean
    class_uri: bridge:BooleanValue
  TimestampValue:
    name: TimestampValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/TimestampValue
    description: A date/time result, ISO-8601 in raw_value.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: MeasurementValue
    slots:
    - type
    - raw_value
    - timestampValue__datetime_value
    attributes:
      datetime_value:
        name: datetime_value
        exact_mappings:
        - nmdc:has_datetime_value
        range: string
    class_uri: bridge:TimestampValue
  TimeValuePair:
    name: TimeValuePair
    definition_uri: https://w3id.org/ber-data/bridge-measurements/TimeValuePair
    description: One point in a time series (BASIN-3D TVP).
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slots:
    - timeValuePair__timestamp
    - timeValuePair__value
    - timeValuePair__point_quality
    attributes:
      timestamp:
        name: timestamp
        description: ISO-8601.
        required: true
      value:
        name: value
        range: double
      point_quality:
        name: point_quality
        description: Per-point quality, as in BASIN-3D ResultListTVP.result_quality.
        range: ResultQualityStatusEnum
    class_uri: bridge:TimeValuePair
  TimeSeriesValue:
    name: TimeSeriesValue
    definition_uri: https://w3id.org/ber-data/bridge-measurements/TimeSeriesValue
    description: 'A timeseries result (BASIN-3D MeasurementTimeseriesTVPResultMixin).
      Series-level unit lives on the owning Measurement''s slots via a QuantityValue-free
      convention: put the unit in `unit` here.'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: MeasurementValue
    slots:
    - type
    - raw_value
    - timeSeriesValue__values
    - timeSeriesValue__unit
    attributes:
      values:
        name: values
        range: TimeValuePair
        required: true
        multivalued: true
        inlined_as_list: true
      unit:
        name: unit
        description: UCUM code for all points in the series.
    class_uri: bridge:TimeSeriesValue
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/ber-data/bridge-measurements/Measurement
    description: 'A single act/record of measuring one observed property of one feature
      of interest, yielding one result. This is the union row: NMDC Biosample.<mixs_slot>
      values, BASALT product columns, and BASIN-3D observations all project into it.
      Deliberately EAV-shaped so that lakehouse-wide search ("all nitrate measurements
      across NMDC, MONet, and watershed timeseries") is a single-table query.'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - sosa:Observation
    close_mappings:
    - nmdc:PropertyAssertion
    slots:
    - id
    - type
    - result
    - measurement__observed_property
    - measurement__observed_property_source_term
    - measurement__feature_of_interest
    - measurement__feature_of_interest_type
    - measurement__feature_position
    - measurement__sampling_medium
    - measurement__phenomenon_time
    - measurement__result_time
    - measurement__utc_offset
    - measurement__statistic
    - measurement__aggregation_duration
    - measurement__replicate_role
    - measurement__replicate_number
    - measurement__summary_of
    - measurement__quality_status
    - measurement__quality_flags
    - measurement__source_quality_label
    - measurement__method
    - measurement__protocol_url
    - measurement__instrument
    - measurement__part_of_collection
    - measurement__was_generated_by
    - measurement__datasource
    attributes:
      observed_property:
        name: observed_property
        description: The BRIDGE/BERVO term for what was measured.
        exact_mappings:
        - sosa:observedProperty
        - nmdc:has_attribute_id
        range: ObservedProperty
        required: true
        inlined: false
      observed_property_source_term:
        name: observed_property_source_term
        description: The verbatim source-native property code (NMDC slot name / MIxS
          CURIE, BASALT column name, USGS parameter code), preserved for round-tripping.
          Resolved to observed_property via SourceTermMapping.
      feature_of_interest:
        name: feature_of_interest
        description: 'Id of the entity the property was measured on: an NMDC biosample
          (nmdc:bsm-...), a BASALT ProcessedSample, a BASIN-3D MonitoringFeature,
          a plate well''s parent culture, an organism. Kept as a loose pointer so
          this module doesn''t import every sample/site class; the central BRIDGE
          FeatureOfInterest role class (harmonization row 3) is the eventual range.'
        exact_mappings:
        - sosa:hasFeatureOfInterest
        range: uriorcurie
      feature_of_interest_type:
        name: feature_of_interest_type
        range: FeatureOfInterestTypeEnum
      feature_position:
        name: feature_position
        description: 'Sub-feature locator when the feature is measured at a position:
          plate well ("A01"), core section ("TOP"/"MID"/"BTM"), depth interval, timepoint
          label.'
      sampling_medium:
        name: sampling_medium
        range: SamplingMediumEnum
      phenomenon_time:
        name: phenomenon_time
        description: ISO-8601 instant or interval when the property applied to the
          feature (collection/observation time, not lab-analysis time).
        exact_mappings:
        - sosa:phenomenonTime
      result_time:
        name: result_time
        description: ISO-8601 time the result was produced (e.g. lab analysis date).
        exact_mappings:
        - sosa:resultTime
      utc_offset:
        name: utc_offset
        range: integer
      statistic:
        name: statistic
        description: Statistical summary the value represents (MEAN, MAX, ...).
        range: StatisticEnum
      aggregation_duration:
        name: aggregation_duration
        description: Time period over which the statistic applies; NONE for instantaneous.
        range: AggregationDurationEnum
      replicate_role:
        name: replicate_role
        description: BASALT measure_type - whether this is a single reading, one replicate,
          or the average.
        range: ReplicateRoleEnum
      replicate_number:
        name: replicate_number
        range: integer
      summary_of:
        name: summary_of
        description: For AVERAGE (or other summary) rows - the member replicate measurements.
        range: Measurement
        multivalued: true
        inlined: false
      quality_status:
        name: quality_status
        description: Coarse validation status (BASIN-3D ResultQualityEnum).
        range: ResultQualityStatusEnum
      quality_flags:
        name: quality_flags
        description: Fine-grained QC flags (BASALT ProcessedDataFlag family); per-measurement,
          not per-run.
        range: QualityFlagEnum
        multivalued: true
      source_quality_label:
        name: source_quality_label
        description: Verbatim source QC code (USGS "A"/"P", BASALT flag, well flag),
          for round-tripping.
      method:
        name: method
        description: Pointer to a Method/Protocol (BASALT *Method classes, NMDC Protocol,
          MIAPPE Method).
        range: uriorcurie
      protocol_url:
        name: protocol_url
        range: uriorcurie
      instrument:
        name: instrument
        description: Pointer to an Instrument record (harmonization row 28 core -
          vendor+model).
        range: uriorcurie
      part_of_collection:
        name: part_of_collection
        description: The assay run / product / dataset this measurement belongs to.
        range: MeasurementCollection
        inlined: false
      was_generated_by:
        name: was_generated_by
        description: 'Pointer to the generating activity: NMDC DataGeneration / WorkflowExecution,
          BASALT DataGenerationActivity / DataProcessingActivity. Distinguishes direct
          readings from derived/ model-fitted quantities (e.g. van Genuchten parameters,
          XCT pore metrics), whose generator is a processing activity.'
        range: uriorcurie
      datasource:
        name: datasource
        description: The contributing source system, e.g. "nmdc", "basalt", "usgs"
          (BASIN-3D DataSource analog); supports faceting the union table by source.
    class_uri: bridge:Measurement
  TimeSeriesMeasurement:
    name: TimeSeriesMeasurement
    definition_uri: https://w3id.org/ber-data/bridge-measurements/TimeSeriesMeasurement
    description: Structural subclass for timeseries results (BASIN-3D MeasurementTimeseriesTVPObservation).
      phenomenon_time holds the series start/end interval.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    is_a: Measurement
    slots:
    - id
    - type
    - measurement__observed_property
    - measurement__observed_property_source_term
    - measurement__feature_of_interest
    - measurement__feature_of_interest_type
    - measurement__feature_position
    - measurement__sampling_medium
    - measurement__phenomenon_time
    - measurement__result_time
    - measurement__utc_offset
    - measurement__statistic
    - measurement__aggregation_duration
    - measurement__replicate_role
    - measurement__replicate_number
    - measurement__summary_of
    - measurement__quality_status
    - measurement__quality_flags
    - measurement__source_quality_label
    - measurement__method
    - measurement__protocol_url
    - measurement__instrument
    - measurement__part_of_collection
    - measurement__was_generated_by
    - measurement__datasource
    - timeSeriesMeasurement__time_reference_position
    - TimeSeriesMeasurement_result
    slot_usage:
      result:
        name: result
        range: TimeSeriesValue
    attributes:
      time_reference_position:
        name: time_reference_position
        description: Whether timestamps mark the START, MIDDLE, or END of each aggregation
          interval.
        range: TimeReferencePositionEnum
    class_uri: bridge:TimeSeriesMeasurement
  MeasurementCollection:
    name: MeasurementCollection
    definition_uri: https://w3id.org/ber-data/bridge-measurements/MeasurementCollection
    description: 'A grouping of measurements produced together: a BASALT *Product
      row (one assay run over one sample), an NMDC DataObject''s parsed contents,
      a BASIN-3D synthesis response, a plate read. Carries what is shared by the group
      - method, instrument, activity, source data file - so Measurement rows stay
      thin.'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slots:
    - id
    - type
    - measurementCollection__name
    - measurementCollection__description
    - measurementCollection__method
    - measurementCollection__instrument
    - measurementCollection__was_generated_by
    - measurementCollection__data_object
    - measurementCollection__summary_metrics
    - measurementCollection__datasource
    attributes:
      name:
        name: name
      description:
        name: description
      method:
        name: method
        range: uriorcurie
      instrument:
        name: instrument
        range: uriorcurie
      was_generated_by:
        name: was_generated_by
        range: uriorcurie
      data_object:
        name: data_object
        description: Pointer(s) to the source data file(s) (checksum+size+format+URL
          core, harmonization row 7).
        range: uriorcurie
        multivalued: true
      summary_metrics:
        name: summary_metrics
        description: Run-level summary key-values (BASALT summary_metrics; plate blank_mean,
          cv_percent).
      datasource:
        name: datasource
    class_uri: bridge:MeasurementCollection
