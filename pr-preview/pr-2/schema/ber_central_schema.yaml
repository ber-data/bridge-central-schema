name: ber-central-schema
description: "The central BRIDGE schema for harmonized cross-BER data access. This\
  \ root\nschema defines the shared base elements and composes domain modules; each\n\
  module corresponds to one or more rows of the BER harmonization-targets\nmatrix\
  \ (see the lakehouse-registry repo).\n\nModules:\n- measurements.yaml: the unified\
  \ Measurement / ObservedProperty model\n  (harmonization rows: Measurement/observation,\
  \ Observed property,\n  QuantityValue). Designed at the 2026-09-30 BER hackathon\
  \ against NMDC,\n  BASALT, and BASIN-3D as reference schemas, with BERVO as the\
  \ primary\n  observed-property vocabulary.\n\nPlanned modules (not yet designed):\n\
  - feature-of-interest (Sample / Site / ObservationTarget role class)\n- agents (Person\
  \ / Organization / Contribution)\n- datasets (Dataset / DataObject / Study)"
title: BRIDGE Central Schema
see_also:
- https://github.com/ber-data/bridge-central-schema
- https://github.com/ber-data/lakehouse-registry
id: https://w3id.org/ber-data/bridge-central-schema
imports:
- linkml:types
- measurements
license: Apache-2.0
prefixes:
  ber_central_schema:
    prefix_prefix: ber_central_schema
    prefix_reference: https://w3id.org/ber-data/bridge-central-schema/
  bridge:
    prefix_prefix: bridge
    prefix_reference: https://w3id.org/ber-data/bridge-measurements/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
default_prefix: ber_central_schema
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ValueTypeEnum:
    name: ValueTypeEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/ValueTypeEnum
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      QUANTITATIVE:
        text: QUANTITATIVE
        meaning: bervo:BERVO_8000244
      QUALITATIVE:
        text: QUALITATIVE
  FeatureOfInterestTypeEnum:
    name: FeatureOfInterestTypeEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/FeatureOfInterestTypeEnum
    description: Coarse type of the thing measured. Members are categorially disjoint
      (material sample vs site vs experimental unit) - this enum is the role-based
      discriminator from harmonization row 3.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      SAMPLE:
        text: SAMPLE
        description: A material specimen (NMDC Biosample, BASALT Sample, lambda Sample).
      PROCESSED_SAMPLE:
        text: PROCESSED_SAMPLE
        description: A derived/processed specimen (extract, core section, filtrate).
      SITE:
        text: SITE
        description: An in-situ location (NMDC FieldResearchSite, BASALT Site).
      MONITORING_FEATURE:
        text: MONITORING_FEATURE
        description: A BASIN-3D monitoring/sampling feature (point, plot, watershed...).
      PLATE_WELL:
        text: PLATE_WELL
        description: A well in a plate assay (BASALT WellReading position).
      ORGANISM:
        text: ORGANISM
        description: An organism or culture (MIAPPE ObservationUnit, strain).
      ECOSYSTEM:
        text: ECOSYSTEM
        description: An ecosystem/landscape unit (EcoSIM/BERVO ecosystem-context variables,
          flux towers).
      OTHER:
        text: OTHER
  SamplingMediumEnum:
    name: SamplingMediumEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/SamplingMediumEnum
    description: BASIN-3D SamplingMediumEnum extended for lab matrices.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      WATER:
        text: WATER
      GAS:
        text: GAS
      SOLID_PHASE:
        text: SOLID_PHASE
        description: Soil, sediment, rock.
      SEDIMENT:
        text: SEDIMENT
      TISSUE:
        text: TISSUE
        description: Plant or other biological tissue.
      CULTURE_MEDIUM:
        text: CULTURE_MEDIUM
      OTHER:
        text: OTHER
      NOT_APPLICABLE:
        text: NOT_APPLICABLE
  StatisticEnum:
    name: StatisticEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/StatisticEnum
    description: BASIN-3D StatisticEnum plus summary statistics needed by BASALT averages
      and plate reads.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      INSTANT:
        text: INSTANT
      MEAN:
        text: MEAN
      MIN:
        text: MIN
      MAX:
        text: MAX
      TOTAL:
        text: TOTAL
      MEDIAN:
        text: MEDIAN
      STANDARD_DEVIATION:
        text: STANDARD_DEVIATION
      COEFFICIENT_OF_VARIATION:
        text: COEFFICIENT_OF_VARIATION
        description: e.g. plate cv_percent.
      OTHER:
        text: OTHER
  AggregationDurationEnum:
    name: AggregationDurationEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/AggregationDurationEnum
    description: BASIN-3D AggregationDurationEnum (OGC TM_PeriodDuration).
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      YEAR:
        text: YEAR
      MONTH:
        text: MONTH
      DAY:
        text: DAY
      HOUR:
        text: HOUR
      MINUTE:
        text: MINUTE
      SECOND:
        text: SECOND
      NONE:
        text: NONE
        description: Instantaneous.
  TimeReferencePositionEnum:
    name: TimeReferencePositionEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/TimeReferencePositionEnum
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      START:
        text: START
      MIDDLE:
        text: MIDDLE
      END:
        text: END
  ReplicateRoleEnum:
    name: ReplicateRoleEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/ReplicateRoleEnum
    description: BASALT ProductMeasureType.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      SINGLE:
        text: SINGLE
      REPLICATE:
        text: REPLICATE
      AVERAGE:
        text: AVERAGE
  ResultQualityStatusEnum:
    name: ResultQualityStatusEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/ResultQualityStatusEnum
    description: Coarse validation status (BASIN-3D ResultQualityEnum). Source synonyms
      documented per value; map source codes here via SourceTermMapping.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      VALIDATED:
        text: VALIDATED
        description: Checked / Accepted / Pass / OK / Good / USGS "A" (Approved).
      UNVALIDATED:
        text: UNVALIDATED
        description: Unchecked / Preliminary / No QC / USGS "P" (Provisional).
      SUSPECT:
        text: SUSPECT
        description: Questionable / Doubtful / Spike-Noise / Flagged.
      REJECTED:
        text: REJECTED
        description: Poor / Bad / Unaccepted / Failed QC.
      ESTIMATED:
        text: ESTIMATED
        description: Interpolated / Modeled / Gap-filled.
  QualityFlagEnum:
    name: QualityFlagEnum
    definition_uri: https://w3id.org/ber-data/bridge-measurements/QualityFlagEnum
    description: 'Fine-grained QC flags: union of BASALT ProcessedDataFlag and plate-well
      flags. A measurement may carry several.'
    from_schema: https://w3id.org/ber-data/bridge-measurements
    permissible_values:
      BELOW_DETECTION_LIMIT:
        text: BELOW_DETECTION_LIMIT
      BELOW_REPORTING_LIMIT:
        text: BELOW_REPORTING_LIMIT
      OUT_OF_RANGE:
        text: OUT_OF_RANGE
      OUTLIER:
        text: OUTLIER
      HIGH_BACKGROUND:
        text: HIGH_BACKGROUND
      FAILED_QC:
        text: FAILED_QC
      INSUFFICIENT_MATERIAL:
        text: INSUFFICIENT_MATERIAL
      DATA_NOT_AVAILABLE:
        text: DATA_NOT_AVAILABLE
      BLANK:
        text: BLANK
        description: Blank/control reading (plate assays).
      CONTAMINATED:
        text: CONTAMINATED
slots:
  name:
    name: name
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/name
    description: A human-readable name for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/description
    description: A human-readable description for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  id:
    name: id
    definition_uri: https://w3id.org/ber-data/bridge-measurements/id
    description: Unique id. For lakehouse-materialized measurement rows a UUID or
      source-derived deterministic id (e.g. "{datasource}:{source_record}:{source_term}").
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:id
    identifier: true
    owner: MeasurementCollection
    domain_of:
    - NamedThing
    - Measurement
    - MeasurementCollection
    range: uriorcurie
    required: true
  type:
    name: type
    definition_uri: https://w3id.org/ber-data/bridge-measurements/type
    description: Class designator (NMDC convention) so polymorphic rows/documents
      resolve to their class.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    mappings:
    - rdf:type
    slot_uri: rdf:type
    designates_type: true
    owner: MeasurementCollection
    domain_of:
    - NamedThing
    - MeasurementValue
    - Measurement
    - MeasurementCollection
    range: uriorcurie
  result:
    name: result
    definition_uri: https://w3id.org/ber-data/bridge-measurements/result
    description: Polymorphic result; type designator on the value picks the subclass.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - sosa:hasResult
    slot_uri: bridge:result
    owner: Measurement
    domain_of:
    - Measurement
    range: MeasurementValue
    required: true
    inlined: true
    inlined_as_list: true
  raw_value:
    name: raw_value
    definition_uri: https://w3id.org/ber-data/bridge-measurements/raw_value
    description: The value exactly as it appeared at the source ("65 umol/L", "2-4
      cm", "Fair"), preserved verbatim for provenance and re-parsing.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - nmdc:has_raw_value
    slot_uri: bridge:raw_value
    owner: MeasurementValue
    domain_of:
    - MeasurementValue
    range: string
  bridgeDatabase__observed_properties:
    name: bridgeDatabase__observed_properties
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    slot_uri: ber_central_schema:observed_properties
    alias: observed_properties
    owner: BridgeDatabase
    domain_of:
    - BridgeDatabase
    range: ObservedProperty
    multivalued: true
    inlined: true
    inlined_as_list: true
  bridgeDatabase__source_term_mappings:
    name: bridgeDatabase__source_term_mappings
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    slot_uri: ber_central_schema:source_term_mappings
    alias: source_term_mappings
    owner: BridgeDatabase
    domain_of:
    - BridgeDatabase
    range: SourceTermMapping
    multivalued: true
    inlined: true
    inlined_as_list: true
  bridgeDatabase__measurement_collections:
    name: bridgeDatabase__measurement_collections
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    slot_uri: ber_central_schema:measurement_collections
    alias: measurement_collections
    owner: BridgeDatabase
    domain_of:
    - BridgeDatabase
    range: MeasurementCollection
    multivalued: true
    inlined: true
    inlined_as_list: true
  bridgeDatabase__measurements:
    name: bridgeDatabase__measurements
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    slot_uri: ber_central_schema:measurements
    alias: measurements
    owner: BridgeDatabase
    domain_of:
    - BridgeDatabase
    range: Measurement
    multivalued: true
    inlined: true
    inlined_as_list: true
  observedProperty__id:
    name: observedProperty__id
    description: BERVO CURIE preferred; else source vocabulary CURIE or bridge-minted
      id.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:id
    identifier: true
    alias: id
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: uriorcurie
    required: true
  observedProperty__label:
    name: observedProperty__label
    description: Human-readable name, e.g. "Nitrate", "Soil respiration".
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:label
    alias: label
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: string
    required: true
  observedProperty__description:
    name: observedProperty__description
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:description
    alias: description
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: string
  observedProperty__categories:
    name: observedProperty__categories
    description: Classification path in priority order (BASIN-3D style), e.g. ["Biogeochemistry",
      "Anions"]. Use BERVO upper-level variable branches (e.g. "Soil biogeochemistry
      variable") when possible.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:categories
    alias: categories
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: string
    multivalued: true
  observedProperty__measurement_of:
    name: observedProperty__measurement_of
    description: The entity or quality quantified, e.g. a CHEBI analyte or PATO quality.
      Mirrors bervo:BERVO_measurement_of.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:measurement_of
    alias: measurement_of
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: uriorcurie
  observedProperty__measured_in:
    name: observedProperty__measured_in
    description: The medium/compartment the property is characteristically measured
      in (e.g. ENVO or BERVO context term). Mirrors bervo:BERVO_measured_in.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    slot_uri: bridge:measured_in
    alias: measured_in
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: uriorcurie
  observedProperty__canonical_unit:
    name: observedProperty__canonical_unit
    description: Preferred reporting unit as a UCUM code, e.g. "mg/L", "Cel", "umol/L".
    from_schema: https://w3id.org/ber-data/bridge-measurements
    exact_mappings:
    - qudt:unit
    slot_uri: bridge:canonical_unit
    alias: canonical_unit
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: string
  observedProperty__value_type:
    name: observedProperty__value_type
