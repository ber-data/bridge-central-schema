  has_genomic_components:
    name: has_genomic_components
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/has_genomic_components
    description: 'References to the genomic parts that make up this context: gene,
      transcript, allele or construct CURIEs. A hook, not a structure; see comments.'
    comments:
    - Deliberately flat for the straw person. AGR models this as AgmAlleleAssociation
      rows each carrying a GENO zygosity term (GENO:0000602 homozygous, GENO:0000603
      heterozygous, ...), and TAIR's germplasm-to-allele associations carry the same
      information as table rows, so the evidence that this eventually becomes an association
      class is strong. No current BER source records zygosity, so the component class
      is deferred; when allele-level data arrives, replace this slot's range with
      a GenomicComponent association class without restructuring anything else.
    - 'This is the intended JGI join point: Phytozome locus CURIEs here join to JGI
      annotations. Gene identifiers are scoped to an assembly and annotation version,
      not to the line, so always populate genome_assemblies alongside this slot. Known
      mismatch to plan for: ORNL pennycress work on the NCBI MN106 v2 assembly uses
      TAV2_LOCUS-style gene ids that do not match Phytozome''s TaMN106 ids for the
      same line; joining them needs an id-mapping resource.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    related_mappings:
