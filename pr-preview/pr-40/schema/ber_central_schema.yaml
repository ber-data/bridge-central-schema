  mutagen:
    name: mutagen
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/mutagen
    description: The mutagen applied to create this lineage, such as EMS, X-rays,
      fast neutron or T-DNA insertion, when it is a mutant line.
    comments:
    - Recorded by TAIR (Mutagen on germplasm and per allele), ABRC donation forms,
      and central to the pennycress and sorghum EMS populations (line names like 2019-M2-207).
      MIAPPE has no field for it; biologicalMaterialPreprocessing is the closest and
      is about pre-study treatment, not lineage origin.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_biocontext:mutagen
