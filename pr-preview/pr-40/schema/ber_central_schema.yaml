    multivalued: true
  genetic_background:
    name: genetic_background
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/genetic_background
    description: 'The reference line or ecotype this lineage was made in or backcrossed
      to, such as Col-0 for a SALK T-DNA insertion line. Distinct from parent_contexts:
      a background is a reference, not a cross parent.'
    comments:
    - TAIR and ABRC both record Background as its own field, separate from pedigree,
      and the opalplants registry records background_germplasm_id with the same meaning.
      The background is itself a BiologicalContext, typically of context_type ecotype,
      accession or strain, so natural accessions (Col-0, Ler-0) become rows rather
      than magic strings.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    close_mappings:
    - MIAPPE:infraspecificName
    slot_uri: bridge_biocontext:genetic_background
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: BiologicalContext
  pedigree:
    name: pedigree
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/pedigree
    description: The pedigree exactly as the source wrote it, in cross notation, for
      example ((SC120-6*Tx7000)Tx7000)-10-4-6-1-1-1-bk (a GRIN sorghum pedigree).
      parent_contexts holds the references that resolve to records; this keeps the
      full string, which usually does not resolve.
    comments:
    - GRIN, TAIR and ABRC all carry pedigree as prose (ABRC's Col-0 lineage exists
      only as a description sentence). A row with resolvable parents populates both.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
