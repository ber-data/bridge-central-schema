  BiologicalContext:
    name: BiologicalContext
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/BiologicalContext
    description: 'A catalog record of biological identity, at whatever level of specificity
      a source knows: a taxon, a strain, isolate, cultivar, accession, line or other
      named lineage, a described genotype, a named population of one taxon, or a community
      of several taxa. Information about identity, not the biological material itself:
      samples point at the most specific context known, and a context can point at
      a broader one.'
    comments:
    - At least one of full_name, symbol or taxon must be populated. The first two
      carry over the AGR AffectedGenomicModel rule; taxon alone admits catalog rows
      from sources that know only a classification (an NMDC organism with a species
      taxid and no strain name).
    - 'One class instead of Organism + GeneticModel, decided 2026-11-12. The 2026-11-11
      squad hackathon read organism as a catalog record and put the measured instance
      in Sample, which left the earlier two-class split holding two catalogs: a taxon
      catalog (Organism) and a lineage catalog (GeneticModel). Those merge here, with
      context_type saying which level a row claims, and broader_context relating levels
      (a described genotype to its strain, a strain row to a species row where a source
      keeps one). NMDC''s strain_name collapses into a strain-type row; AGR''s AGM
      maps to the strain/genotype/line rows; the Tier-1 Option 2 BiologicalClassification
      maps to the class as a whole.'
    - 'Strain versus genotype, as users mean them. A strain / line / cultivar / accession
      is a material lineage you can obtain and propagate (it has a stock center, a
      holding institute, parents). A genotype is a description of genetic composition
      (alleles, zygosity, background). A strain has a genotype; a genotype can be
      written down for an individual that belongs to no named lineage. Both NMDC and
      AGR collapsed the two in practice, and no current BER source records allele-level
      composition, so one class with context_type carries both, and decomposition
      stays in has_genomic_components. GENO draws the same line explicitly: GENO:0000536
      genotype is information, GENO:0000112 strain is a collection of organisms; an
      ontologically strict future revision would split along it.'
    - Microbes and communities. A pure culture's sample points at the strain or isolate
      row - no one studies a single microbial cell, so there is no individual-level
      microbial record to make. A defined mixed culture (SynCom) is a community row
      whose member_contexts list the strains. An environmental community is a community
      row whose taxon, when given at all, is a metagenome-style NCBI taxon (soil metagenome,
      NCBITaxon:410658); its measured composition is data (taxonomic profiles), not
      catalog metadata, and stays in the source's own tables.
    - 'Per-kingdom usage of context_type. Plants: cultivar, accession, line (RILs),
      variety, ecotype (MCPD ranks via MIAPPE infraspecificName). Animals: strain
      (mouse, rat), genotype (fish, fly). Microbes and fungi: strain, isolate; engineered
      strains are strains whose has_genomic_components lists the modifications; NCBI
      Taxonomy sometimes has strain-level taxa (E. coli K-12 MG1655, NCBITaxon:511145),
      in which case taxon points there and the species rollup comes from the taxonomy,
      not this schema. Viruses: variant, isolate. Any kingdom: taxon, population,
      community.'
    - 'What this class is not. Not a Sample: a context is not material, is not taken
      from a larger body, and is not input to a measurement. The inference directions
      differ - a sample licenses claims upward about the body it came from; a context
      licenses generalization downward over its instances, which is the aggregation
      (knowledge) layer. Not a thing measurements are about: you measure plant 29041,
      not RIL 407, so feature_of_interest never points here. The sample-shaped neighbors
      are stocks, seed lots and culture aliquots (TAIR splits Germplasm from Stock
      for this reason): material instances of a lineage entering a lab workflow are
      Samples whose biological_context points here.'
    - 'Lakehouse join points. has_genomic_components is the intended JGI connection
      (gene / transcript / allele CURIEs), anchored by genome_assemblies. The opalplants
      pennycress registry joins at the line: its germplasm_id (PCG000001...) is a
      biological_context_id, its passport row fills the material_source_* block, its
      germplasm_parent rows fill parent_contexts, and its aliases fill synonyms and
      secondary_identifiers. EMSL MONet connects at study/project level only; nothing
      context-shaped exists there.'
    - 'Survey of plant resources (2026-11-10; Gramene, TAIR, SorghumBase/GRIN, Ensembl
      Plants, Phytozome/GOLD, ABRC, pennycress resources): none has a genotype entity.
      Allelic composition everywhere is an association (TAIR germplasm-to-allele rows
      carrying zygosity; Ensembl per-variant sample calls), which supports keeping
      this class name-level and deferring components. Two recurring splits this single
      class absorbs: (1) the line versus the orderable stock (TAIR Germplasm vs Stock)
      - the stock side lands in the material_source_* block; (2) the line versus its
      genome assembly (Ensembl, Phytozome, Gramene) - the assembly side lands in genome_assemblies.
      GOLD''s organism entity has a strain field and no cultivar field, so GOLD organisms
      map here with context_type strain or cultivar as the source metadata indicates.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
