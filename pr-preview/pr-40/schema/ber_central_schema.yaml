classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/NamedThing
    description: Generic base for any identifiable BRIDGE entity.
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:Thing
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/Measurement
    description: One value of one property of one thing, as reported by a source.
      A measurement may carry a number with a unit, a range, a summary statistic,
      a categorical term, or only the source text, and it may say why no value is
      present. The 2026-09-30 hackathon chose to start with this single class and
      add an Observation class only when data shows a need for one.
    comments:
    - A measurement must carry at least one of raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, coded_value or missing_value_reason, so an empty measurement
      fails validation.
    - A measurement names its property with exactly one of observed_property (an identifier)
      or property_label (free text). property_label is the catch-all for values whose
      property has no identifier yet, as MIxS misc_param, NMDC PropertyAssertion and
      BERtron Attribute allow.
    - 'The value slots come in two groups. raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, unit and coded_value hold the value itself: raw_value
      as the source wrote it, the others as parsed from it (numeric_value for a number,
      coded_value for a category). comparator, statistic, standard_deviation, sample_size,
      value_role, value_qualifier and missing_value_reason say something about that
      value.'
    - A source cell that holds several values (for example a width and a length) becomes
      several measurements that share source_record_id and source_field.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - sosa:Observation
    - nmdc:QuantityValue
    slots:
    - measurement_id
    - Measurement_observed_property
    - property_label
    - feature_of_interest
    - Measurement_raw_value
    - numeric_value
    - minimum_numeric_value
    - maximum_numeric_value
    - unit
    - unit_basis
    - coded_value
    - comparator
    - statistic
    - standard_deviation
    - sample_size
    - value_role
    - value_qualifier
    - missing_value_reason
    - measurement_method
    - treatment
    - instrument
    - observed_time
    - observed_start_time
    - observed_end_time
    - source_system
    - source_record_id
    - source_field
    - quality_flag
    slot_usage:
      observed_property:
        name: observed_property
        recommended: true
      raw_value:
        name: raw_value
        recommended: true
    class_uri: bridge_central_schema:Measurement
    any_of:
    - slot_conditions:
        raw_value:
          name: raw_value
          required: true
    - slot_conditions:
        numeric_value:
          name: numeric_value
          required: true
    - slot_conditions:
        minimum_numeric_value:
          name: minimum_numeric_value
          required: true
    - slot_conditions:
        maximum_numeric_value:
          name: maximum_numeric_value
          required: true
    - slot_conditions:
        coded_value:
          name: coded_value
          required: true
    - slot_conditions:
        missing_value_reason:
          name: missing_value_reason
          required: true
    exactly_one_of:
    - slot_conditions:
        observed_property:
          name: observed_property
          required: true
    - slot_conditions:
        property_label:
          name: property_label
          required: true
  PhenotypicMeasurement:
    name: PhenotypicMeasurement
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/PhenotypicMeasurement
    description: 'A measurement of a phenotypic trait of an organism or observation
      unit: one trait value, produced by one method, at one time. Modeled on MIAPPE
      v1.2 Observed Variable (trait + method + scale) and on the ORNL APPL plant phenotyping
      exports, where one Observation row is one trait value from one imaging event.'
    comments:
    - 'Deliberately thin. Measurement already carries what phenotyping needs: the
      trait''s name goes in observed_property or property_label, the method in measurement_method,
      the summary in statistic, the image-QC state in quality_flag, missing values
      in missing_value_reason, and computed traits (pixel counts times a calibration
      scale, such as APPL''s millimetre areas) in value_role derived. Only the trait-ontology
      hooks are new.'
    - 'Phenotype versus measurement: a raw trait value (projected shoot area on one
      date, Fv/Fm from one fluorescence event) is a measurement and belongs here.
      An interpreted phenotype claim ("dwarf under high dose"), aggregated over many
      measurements, is a knowledge-level assertion and is deliberately NOT this class;
      value_role interpreted covers a single interpreted value, and a future Phenotype
      class referencing the measurements it derives from would cover the aggregate.
      Flagged as an open question on the biological-context straw person.'
    - QC values that describe the measuring process rather than the organism (for
      example APPL's fc1.mask_coverage_pct segmentation coverage) should be plain
      Measurements, not PhenotypicMeasurements, so trait tables are not polluted with
      instrument diagnostics.
    - 'A known APPL pitfall this model should not reproduce: events whose segmentation
      found no plant (empty_mask) store 0.0 instead of no value. Here that case keeps
      the source''s 0.0 in raw_value only, with missing_value_reason not_determined
      and quality_flag empty_mask, so no parsed numeric_value fabricates a size for
      a plant that was not seen.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    is_a: Measurement
    slots:
    - measurement_id
    - Measurement_observed_property
    - property_label
    - feature_of_interest
    - Measurement_raw_value
    - numeric_value
    - minimum_numeric_value
    - maximum_numeric_value
    - unit
    - unit_basis
    - coded_value
    - comparator
    - statistic
    - standard_deviation
    - sample_size
    - value_role
    - value_qualifier
    - missing_value_reason
    - measurement_method
    - treatment
    - instrument
    - observed_time
    - observed_start_time
    - observed_end_time
    - source_system
    - source_record_id
    - source_field
    - quality_flag
    - trait_term
    - trait_entity_term
    class_uri: bridge_central_schema:PhenotypicMeasurement
  Treatment:
    name: Treatment
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/Treatment
    description: 'One applied level of one experimental factor: the thing an experimenter
      set, as opposed to measured. Examples: spike_dose=200 in the APPL OPAL dose
      series; a 600 mg/kg Ni amendment; the "unwatered" arm of a watering regime.
      A factor with several levels becomes several Treatment records sharing factor_name
      and factor_type.'
    comments:
    - 'At least one of treatment_label or factor_name must be populated: a record
      must say either which level it is or which factor it is a level of.'
    - Level, not factor. MIAPPE's Experimental Factor describes the factor once and
      lists its values; sources join on the level (OPAL obsUnitFactorValue "spike_dose=0",
      opal.plant.treatment labels), so the record here is the level and the factor
      lives in the shared factor_name/factor_type/treatment_description values. If
      a future source needs factor-level metadata that does not repeat cleanly (a
      protocol document per factor), an ExperimentalFactor class can be added above
      this one without moving any slot.
    - The value slots are the measurements module's. numeric_value carries an exact
      dose, minimum/maximum_numeric_value carry a dose known only as bounds (the opalplants
      dosing study records Ni doses both ways), unit is UCUM, and raw_value keeps
      the source text. Every value on a Treatment is a setting in the measurements
      module's value_role sense; do not also create a Measurement with value_role
      setting for the same fact unless the source reports the achieved value as measured
      (a target dose here, the measured realized dose as a Measurement).
    - 'The subject points at its treatments via applied_treatments, mirroring MIAPPE
      where factor values attach to observation units. applied_treatments is a Sample-bound
      slot: owned by no class yet, defined for the squad''s Sample class (PR #39)
      to adopt alongside the biological_context module''s Sample-bound slots (biological_context,
      observation_unit_type, spatial_position, replicate). The 2026-11-11 hackathon
      decision that a sample carries nullable pointers to its biology extends naturally
      to its treatments.'
    - Evidence and status columns (opal.treatment.status, .source) are deliberately
      left off the straw person; if they prove common, reuse the measurements module's
      source_system / source_record_id / quality_flag here.
