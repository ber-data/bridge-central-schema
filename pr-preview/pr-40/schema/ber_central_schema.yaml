  member_of_populations:
    name: member_of_populations
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/member_of_populations
    description: Named panels, populations or collections this lineage belongs to,
      such as the Sorghum Association Panel, the 1001 Genomes collection, or a stock-center
      set. Free text or CURIE as the source provides.
    comments:
    - Membership of this row in a larger named set, as the source states it; the inverse
      of member_contexts, kept as text because panels are rarely rows. Do not put
      pedigree here.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_biocontext:member_of_populations
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
    multivalued: true
  genome_assemblies:
    name: genome_assemblies
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/genome_assemblies
    description: 'Genome assembly or annotation releases of this lineage: INSDC assembly
      accessions (GCA_911865555.2 for pennycress MN106-Ref) or portal release identifiers
      (Phytozome Tarvensevar_MN106_v4_1, Ensembl production names such as oryza_sativa_mh63).
      The scope anchor for has_genomic_components.'
    comments:
    - 'Every genome resource surveyed identifies a sequenced line primarily by its
      assembly (Gramene and Ensembl: one cultivar = one genome database with a GCA
      accession; Phytozome: genome release slugs; SorghumBase: per-line gene namespaces).
      A line can have several (BTx623 has v3 SORBI_3 and v5.1 Sobic annotations simultaneously).'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_biocontext:genome_assemblies
    owner: BiologicalContext
    domain_of:
