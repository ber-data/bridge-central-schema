name: ber-central-schema
description: 'The central BRIDGE schema for harmonized cross-BER data access. Defines
  shared base elements and composes domain modules (currently: measurements.yaml,
  biological_context.yaml, treatments.yaml).'
title: BRIDGE Central Schema
see_also:
- https://github.com/doe-bridge/bridge-central-schema
- https://github.com/doe-bridge/lakehouse-registry
id: https://w3id.org/ber-data/bridge-central-schema
imports:
- linkml:types
- measurements
- treatments
- biological_context
license: Apache-2.0
prefixes:
  bridge_central_schema:
    prefix_prefix: bridge_central_schema
    prefix_reference: https://w3id.org/ber-data/bridge-central-schema/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  GENO:
    prefix_prefix: GENO
    prefix_reference: http://purl.obolibrary.org/obo/GENO_
  EFO:
    prefix_prefix: EFO
    prefix_reference: http://www.ebi.ac.uk/efo/EFO_
  NCIT:
    prefix_prefix: NCIT
    prefix_reference: http://purl.obolibrary.org/obo/NCIT_
  PCO:
    prefix_prefix: PCO
    prefix_reference: http://purl.obolibrary.org/obo/PCO_
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/vocab/
default_prefix: bridge_central_schema
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  PartialDateTime:
    name: PartialDateTime
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/PartialDateTime
    description: An ISO 8601 year, year-month, date, or date-time. A date-time must
      carry a UTC offset or Z; a date or coarser carries none.
    comments:
    - The pattern checks each part's range but not whether a day exists in its month,
      so 2021-02-31 passes.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01])(T([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]+)?)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9]))?)?)?$
enums:
  ComparatorEnum:
    name: ComparatorEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/ComparatorEnum
    description: How a reported number relates to the true value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    permissible_values:
      less_than:
        text: less_than
        description: The true value is below numeric_value.
      less_than_or_equal:
        text: less_than_or_equal
        description: The true value is at or below numeric_value.
      greater_than:
        text: greater_than
        description: The true value is above numeric_value.
      greater_than_or_equal:
        text: greater_than_or_equal
        description: The true value is at or above numeric_value.
      approximately:
        text: approximately
        description: The source gave numeric_value as an approximation.
  StatisticEnum:
    name: StatisticEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/StatisticEnum
    description: Summary statistics a measurement value can report.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    permissible_values:
      mean:
        text: mean
        description: The arithmetic mean of the readings or individuals.
      median:
        text: median
        description: The median of the readings or individuals.
      minimum:
        text: minimum
        description: The smallest of the readings or individuals.
      maximum:
        text: maximum
        description: The largest of the readings or individuals.
      standard_deviation:
        text: standard_deviation
        description: numeric_value is itself a standard deviation, for sources that
          report it as its own value.
      sum:
        text: sum
        description: The total of the readings, such as a daily precipitation total.
  ValueRoleEnum:
    name: ValueRoleEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/ValueRoleEnum
    description: How a value came to be recorded.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    permissible_values:
      measured:
        text: measured
        description: The value was measured, including a summary of several measurements,
          such as a spatial or daily mean (give the summary in statistic).
      setting:
        text: setting
        description: The value was set as an experimental condition, for example growth
          at 5 degrees Celsius for 2 hours.
      interpreted:
        text: interpreted
        description: A person assigned the value after interpreting other measurements,
          for example a strain labelled mesophilic.
      derived:
        text: derived
        description: The value of one property was computed from values of other properties,
          for example a projected shoot area calculated from a pixel count and an
          image scale. A mean of readings of the same property is measured, not derived.
  ValueQualifierEnum:
    name: ValueQualifierEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/ValueQualifierEnum
    description: Qualifiers a source attaches to a value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    permissible_values:
      optimum:
        text: optimum
        description: The value at which a process (usually growth) is best.
      tolerated:
        text: tolerated
        description: A value or range within which a process can occur.
  MissingValueReasonEnum:
    name: MissingValueReasonEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/MissingValueReasonEnum
    description: Reasons a measurement has no usable value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    permissible_values:
      not_determined:
        text: not_determined
        description: The source says the value was not determined.
      not_applicable:
        text: not_applicable
        description: The property does not apply to this thing.
      not_reported:
        text: not_reported
        description: The source leaves the value empty and gives no reason.
      below_detection_limit:
        text: below_detection_limit
        description: The value was below the method's detection limit.
      above_detection_limit:
        text: above_detection_limit
        description: The value was above the method's upper detection limit.
      unknown:
        text: unknown
        description: The source says the value is unknown, for example by writing
          unknown where the value would be.
      out_of_range:
        text: out_of_range
        description: The source used a sentinel value meaning the reading was outside
          the instrument's range.
  BiologicalContextTypeEnum:
    name: BiologicalContextTypeEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/BiologicalContextTypeEnum
    description: 'Kinds of biological identity a BiologicalContext row can claim.
      AGR''s subtype_values (strain, genotype, fish) widened for BER: fish is dropped
      (it is a taxon fact, not a subtype); plant, microbial and viral usage is added;
      and taxon, population and community admit the catalog rows the merged class
      absorbs.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    permissible_values:
      taxon:
        text: taxon
        description: A row that is exactly a taxon in a reference taxonomy, for sources
          that know only the classification (an NMDC organism with a species taxid
          and no strain name).
        meaning: biolink:OrganismTaxon
      genotype:
        text: genotype
        description: A described genetic composition, as used for fish and fly models
          (ZFIN, FlyBase) and for plant genotypes in the GWAS sense. GENO defines
          it as a specification of the genetic state of an organism, i.e. information,
          not material.
        meaning: GENO:0000536
      strain:
        text: strain
        description: 'A maintained lineage: mouse and rat strains, microbial and fungal
          strains, including engineered strains. GENO''s term is "strain or breed":
          a collection of organisms bred or manipulated with the goal of being genetically
          identical.'
        meaning: GENO:0000112
      isolate:
        text: isolate
        description: A lineage derived from a single environmental or clinical isolation
          event (microbes, fungi, viruses); nmdc isolate_name maps here.
      cultivar:
        text: cultivar
        description: A cultivated plant variety selected and given a name because
          it has desirable characteristics (MCPD cv.; EFO definition). Also TAXRANK:0000034
          as a taxonomic rank; not in GENO.
        meaning: EFO:0005136
      accession:
        text: accession
        description: A germplasm accession held by a genebank or collection; MIAPPE's
          material source entity.
      line:
        text: line
        description: A named laboratory or breeding line, including recombinant inbred
          lines (RILs) such as the APPL Thlaspi arvense lines.
      variety:
        text: variety
        description: 'A botanical variety (MCPD var.): in botanical nomenclature,
          a rank below subspecies but above forma (NCIT definition; not in GENO).'
        meaning: NCIT:C62709
      subspecies:
        text: subspecies
        description: A subspecies-rank entity (MCPD subsp.).
      ecotype:
        text: ecotype
        description: A naturally occurring population adapted to a locality, as used
          for Arabidopsis ecotypes. TAIR models these as first-class records with
          collection-site passport data; the material_source_* block carries it here.
      landrace:
        text: landrace
        description: A traditional, locally adapted variety not produced by formal
          breeding. One of GRIN's improvement-status values (cultivar / landrace /
          genetic material), which is the closest operational analog of this enum
          in a working genebank.
      variant:
        text: variant
        description: A viral variant or lineage designation.
      population:
        text: population
        description: 'A named population of organisms of one taxon treated as a catalog
          identity in its own right: a GWAS population descriptor, a sequenced panel''s
          subpopulation. A pure culture is NOT a population row - its sample points
          at the strain.'
        meaning: PCO:0000001
      community:
        text: community
        description: 'An assemblage of organisms of several taxa: a defined synthetic
          community (SynCom) whose member_contexts list the strains, an enrichment,
          or the expected biology of an environmental sample (taxon then holds a metagenome-style
          NCBI taxon).'
        meaning: PCO:0000002
  ObservationUnitTypeEnum:
    name: ObservationUnitTypeEnum
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/ObservationUnitTypeEnum
    description: The MIAPPE v1.2 observation-unit levels, plus culture as a BRIDGE
      extension for microbial growth vessels.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    permissible_values:
      study:
        text: study
        description: The whole study observed as one unit.
      block:
        text: block
        description: A block of the experimental design.
      sub_block:
        text: sub_block
        description: A sub-block of a block.
      plot:
        text: plot
        description: A plot of the experimental design.
      sub_plot:
        text: sub_plot
        description: A sub-plot of a plot.
      pot:
        text: pot
        description: A pot or container holding one or more plants.
      plant:
        text: plant
        description: One individual plant (the APPL study 67 unit).
      culture:
        text: culture
        description: A microbial growth vessel (flask, plate, well). Not in MIAPPE;
          BRIDGE extension so designed microbial experiments can use the same level
          vocabulary.
slots:
  id:
    name: id
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/id
    description: A unique identifier for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: NamedThing
    domain_of:
    - NamedThing
    range: uriorcurie
    required: true
  name:
    name: name
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/name
    description: A human-readable name for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/description
    description: A human-readable description for a thing
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  measurement_id:
    name: measurement_id
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/measurement_id
    description: An identifier for this measurement, when the source has one or BRIDGE
      mints one on ingest. Optional, because many sources (ESS-DIVE among them) do
      not identify individual measurements.
    comments:
    - 'Not named id: the central schema''s id slot is an identifier, which LinkML
      makes required, and most measurements have no identifier.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:measurement_id
    owner: Measurement
    domain_of:
    - Measurement
    range: uriorcurie
  observed_property:
    name: observed_property
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/observed_property
    description: The property that was measured, as a BRIDGE property identifier (bridge_property:).
    comments:
    - 'Each bridge_property: term has an ID, a label and a definition in terms/bridge_property.tsv,
      and mappings to BERVO, MIxS and other vocabularies in mappings/observed_property.sssom.tsv.
      New terms are added by pull request. A term''s ID does not change once merged;
      its label and definition can be edited.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    aliases:
    - measurement_type
    - variable
    exact_mappings:
    - sosa:observedProperty
    slot_uri: bridge_central_schema:observed_property
    owner: Measurement
    domain_of:
    - Measurement
    range: uriorcurie
    pattern: ^bridge_property:[a-z0-9_]+$
  property_label:
    name: property_label
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/property_label
    description: The name of the measured property as free text, for values whose
      property has no BRIDGE identifier yet. Use observed_property instead whenever
      an identifier exists.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_attribute_label
    - MIXS:0000752
    slot_uri: bridge_central_schema:property_label
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  feature_of_interest:
    name: feature_of_interest
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/feature_of_interest
    description: 'A reference to the thing whose property was measured: a sample,
      an organism, a site or plot, a stream. Only a reference: classes for samples
      belong to the Samples, Projects, and Processes Modelling Squad, and classes
      for sites, plots and other landscape features to the Landscape/Physical Features
      module proposed in the 2026-10-07 BRIDGE DM notes.'
    comments:
    - 'The things this may point at - the issue #32 MeasuredEntity discussion - are
      a Site or a Sample (the squad''s broadened Sample, PR #39, covers the observed
      individual: a potted plant or a tree is a Sample representing its line or population).
      Conceptually these are sosa:FeatureOfInterest, "the thing whose property is
      being estimated or calculated in the course of an Observation". No grouping
      class or subset marks them: LinkML''s docs give mixins to attribute-sharing,
      not marking, and no construct (range, parent, mixin, any_of, subset) validates
      what a reference id points at, so membership lives in this comment and enforcement
      is a downstream check over these classes'' id columns. A BiologicalContext (a
      line, strain or taxon row) is deliberately not on the list: you measure plant
      29041, not RIL 407 - line-level claims are aggregations over measurements, not
      measurements.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    see_also:
    - https://github.com/doe-bridge/bridge-central-schema/issues/32
    exact_mappings:
    - sosa:hasFeatureOfInterest
    slot_uri: bridge_central_schema:feature_of_interest
    owner: Measurement
    domain_of:
    - Measurement
    range: uriorcurie
  raw_value:
    name: raw_value
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/raw_value
    description: The value exactly as it appeared at the source, including its unit
      text, ranges, qualifiers and any non-ASCII characters. Never edited. The other
      value slots are parsed from it.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_raw_value
    slot_uri: bridge_central_schema:raw_value
    owner: Treatment
    domain_of:
    - Measurement
    - Treatment
    range: string
  numeric_value:
    name: numeric_value
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/numeric_value
    description: A single number parsed from raw_value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_numeric_value
    slot_uri: bridge_central_schema:numeric_value
    owner: Treatment
    domain_of:
    - Measurement
    - Treatment
    range: double
  minimum_numeric_value:
    name: minimum_numeric_value
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/minimum_numeric_value
    description: The lower end of a range, or the lower bound of a one-sided value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_minimum_numeric_value
    slot_uri: bridge_central_schema:minimum_numeric_value
    owner: Treatment
    domain_of:
    - Measurement
    - Treatment
    range: double
  maximum_numeric_value:
    name: maximum_numeric_value
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/maximum_numeric_value
    description: The upper end of a range, or the upper bound of a one-sided value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_maximum_numeric_value
    slot_uri: bridge_central_schema:maximum_numeric_value
    owner: Treatment
    domain_of:
    - Measurement
    - Treatment
    range: double
  unit:
    name: unit
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/unit
    description: "The unit as a UCUM code, written in printable ASCII (for example\
      \ um, not \xB5m). Leave empty for values without a unit, such as pH. The source's\
      \ own spelling stays in raw_value. UCUM is a grammar rather than a fixed list,\
      \ so most units can be written even when no common code exists, and annotations\
      \ in braces cover counted things ({cells}/g). When a unit cannot be written\
      \ in UCUM, leave unit empty and keep the source's unit in raw_value. Many units\
      \ from QUDT (used by ESS-DIVE) carry a UCUM code (qudt:ucumCode) that can go\
      \ here."
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_unit
    slot_uri: bridge_central_schema:unit
    owner: Treatment
    domain_of:
    - Measurement
    - Treatment
    range: string
    pattern: ^[!-~]+$
  unit_basis:
    name: unit_basis
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/unit_basis
    description: What the unit is expressed relative to, when the unit alone does
      not say, such as dry weight. Some bases fit UCUM annotations (mg{C}/L); this
      slot is for those that do not. Free text until examples settle a vocabulary.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:unit_basis
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  coded_value:
    name: coded_value
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/coded_value
    description: A categorical value as a code from an ontology or controlled vocabulary,
      parsed from raw_value the way numeric_value is parsed for a number, such as
      METPO:1000615 (mesophilic). The source wording stays in raw_value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:coded_value
    owner: Measurement
    domain_of:
    - Measurement
    range: uriorcurie
  comparator:
    name: comparator
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/comparator
    description: How the true value relates to numeric_value, for values reported
      as above or below a number, such as below a detection limit. When the source
      gives the limit as a number, record it in numeric_value with a comparator; when
      it gives no number, use missing_value_reason below_detection_limit instead.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:comparator
    owner: Measurement
    domain_of:
    - Measurement
    range: ComparatorEnum
  statistic:
    name: statistic
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/statistic
    description: The summary statistic that numeric_value reports, when the source
      value summarizes several readings or individuals.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:statistic
    owner: Measurement
    domain_of:
    - Measurement
    range: StatisticEnum
  standard_deviation:
    name: standard_deviation
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/standard_deviation
    description: The standard deviation reported with a mean, in the same unit.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:standard_deviation
    owner: Measurement
    domain_of:
    - Measurement
    range: double
    minimum_value: 0
  sample_size:
    name: sample_size
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/sample_size
    description: How many readings, replicates or individuals a statistic summarizes.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:sample_size
    owner: Measurement
    domain_of:
    - Measurement
    range: integer
    minimum_value: 1
  value_role:
    name: value_role
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/value_role
    description: Whether the value was measured, set as an experimental condition,
      or assigned by a person interpreting other measurements.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:value_role
    owner: Measurement
    domain_of:
    - Measurement
    range: ValueRoleEnum
  value_qualifier:
    name: value_qualifier
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/value_qualifier
    description: A qualifier the source attaches to the value, such as an optimum
      (optimal growth at 10 MPa).
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:value_qualifier
    owner: Measurement
    domain_of:
    - Measurement
    range: ValueQualifierEnum
  missing_value_reason:
    name: missing_value_reason
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/missing_value_reason
    description: Why no usable value is present. Sources often write these as text
      (not determined) or as sentinel numbers (-9999); record the source text in raw_value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:missing_value_reason
    owner: Measurement
    domain_of:
    - Measurement
    range: MissingValueReasonEnum
  measurement_method:
    name: measurement_method
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/measurement_method
    description: 'How the value was obtained: a protocol name, a method reference,
      or the source''s companion method field (for example an NMDC ph_meth value).'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - sosa:usedProcedure
    slot_uri: bridge_central_schema:measurement_method
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  treatment:
    name: treatment
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatment
    description: The experimental treatment applied to the thing measured, such as
      a warming or nitrogen addition plot, kept apart from measurement_method because
      downstream users filter and compare on it.
    comments:
    - Free text, for flat sources. When the source gives the treatment its own structure
      (a factor with levels and doses, as the APPL OPAL export and the opalplants
      treatment table do), model it as a Treatment record (treatments module) referenced
      from the subject's applied_treatments, and keep the label the source wrote here.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:treatment
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  instrument:
    name: instrument
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/instrument
    description: The instrument or sensor that produced the value.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - sosa:madeBySensor
    slot_uri: bridge_central_schema:instrument
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  observed_time:
    name: observed_time
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/observed_time
    description: 'When the property was observed, in ISO 8601 at whatever resolution
      the source gives: a year (2021), a year and month (2021-06), a date (2021-06-15),
      or a date-time with a UTC offset (2021-06-15T14:30:00-07:00). A time of day
      must carry an offset; a date or coarser does not.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - sosa:phenomenonTime
    slot_uri: bridge_central_schema:observed_time
    owner: Measurement
    domain_of:
    - Measurement
    range: PartialDateTime
  observed_start_time:
    name: observed_start_time
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/observed_start_time
    description: The start of the period a value covers, for sources that report a
      start and an end instead of one time. Same format as observed_time.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:observed_start_time
    owner: Measurement
    domain_of:
    - Measurement
    range: PartialDateTime
  observed_end_time:
    name: observed_end_time
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/observed_end_time
    description: The end of the period a value covers. Same format as observed_time.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:observed_end_time
    owner: Measurement
    domain_of:
    - Measurement
    range: PartialDateTime
  source_system:
    name: source_system
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/source_system
    description: The system the value came from. Use the BER lakehouse registry entry
      (https://github.com/doe-bridge/lakehouse-registry) for the source's schema when
      it has one, such as ber_registry:schema-jgi-gold; otherwise the system's name,
      such as BASIN-3D (USGS).
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:source_system
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  source_record_id:
    name: source_record_id
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/source_record_id
    description: The identifier of the source record the value came from, in the source's
      own format. The schema does not impose a format.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:source_record_id
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  source_field:
    name: source_field
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/source_field
    description: The source field, column or slot the value came from, named as the
      source names it.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:source_field
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  quality_flag:
    name: quality_flag
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/quality_flag
    description: A flag from the source or from BRIDGE curation, such as needs_review
      for a value that could not be parsed.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    slot_uri: bridge_central_schema:quality_flag
    owner: Measurement
    domain_of:
    - Measurement
    range: string
  trait_term:
    name: trait_term
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/trait_term
    description: Ontology accession for the phenotypic trait as a whole (Trait Ontology,
      Crop Ontology), when one exists. The trait's name goes in observed_property
      or property_label as for any measurement; this slot adds the trait-ontology
      mapping MIAPPE asks for. In the APPL corpus 0 of 512 variables carry any trait
      accession, so this is optional and expected to be sparse.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    exact_mappings:
    - MIAPPE:traitAccNumber
    slot_uri: bridge_central_schema:trait_term
    owner: PhenotypicMeasurement
    domain_of:
    - PhenotypicMeasurement
    range: uriorcurie
  trait_entity_term:
    name: trait_entity_term
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/trait_entity_term
    description: Ontology accession for the part of the organism the trait is about
      (Plant Ontology for plants), for example PO:0009006 shoot system.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    exact_mappings:
    - MIAPPE:traitEntityAccessionNumber
    slot_uri: bridge_central_schema:trait_entity_term
    owner: PhenotypicMeasurement
    domain_of:
    - PhenotypicMeasurement
    range: uriorcurie
  treatment_id:
    name: treatment_id
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/treatment_id
    description: Unique identifier for the treatment level. When the source assigns
      one, keep it; otherwise BRIDGE derives one on ingest from the study and the
      level label.
    comments:
    - Not named id; reserved for reconciliation with the central schema's NamedThing
      id slot, like biological_context_id.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/treatments
    slot_uri: bridge_treatments:treatment_id
    identifier: true
    owner: Treatment
    domain_of:
    - Treatment
    range: uriorcurie
    required: true
  treatment_label:
    name: treatment_label
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/treatment_label
    description: 'The level as the source writes it, kept joinable with the source:
      "spike_dose=200" (APPL obsUnitFactorValue), "ctrl_0mM", the opal.plant.treatment
      string.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/treatments
    close_mappings:
    - MIAPPE:observationUnitFactorValue
    slot_uri: bridge_treatments:treatment_label
    owner: Treatment
    domain_of:
    - Treatment
    range: string
  factor_name:
    name: factor_name
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/factor_name
    description: 'The experimental factor this is a level of, named as the source
      names the variable: spike_dose (the APPL design column), watering regime, warming.'
    comments:
    - 'MIAPPE has no separate factor-name field; the factor is named implicitly by
      its values ("Watering: watered / unwatered"). The APPL export makes the name
      explicit (applAttributeName), and joining levels into a factor needs it, so
      it is its own slot here.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/treatments
    close_mappings:
    - MIAPPE:factorValues
    slot_uri: bridge_treatments:factor_name
    owner: Treatment
    domain_of:
    - Treatment
    range: string
  factor_type:
    name: factor_type
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/factor_type
    description: 'The kind of factor, as free text or an ontology term label: MIAPPE
      suggests terms like watering, nutrient fertilizing, chemical administration
      (the APPL OPAL factor type), air humidity regime.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/treatments
    exact_mappings:
    - MIAPPE:factorType
    slot_uri: bridge_treatments:factor_type
    owner: Treatment
    domain_of:
    - Treatment
    range: string
  treatment_description:
    name: treatment_description
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/treatment_description
    description: Free-text description of the factor and how it was applied, including
      anything unresolved about it (the APPL OPAL export notes "unit UNCONFIRMED"
      on its dose factor).
    from_schema: https://w3id.org/ber-data/bridge-central-schema/treatments
    mappings:
    - schema:description
    exact_mappings:
    - MIAPPE:factorDescription
    slot_uri: schema:description
    owner: Treatment
    domain_of:
    - Treatment
    range: string
  applied_treatments:
    name: applied_treatments
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/treatments/applied_treatments
    description: 'The treatment levels applied to this subject, one per factor it
      participates in: the MIAPPE observation unit factor value, OPAL''s per-plant
      treatment label, resolved to Treatment records.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/treatments
    close_mappings:
    - MIAPPE:observationUnitFactorValue
    slot_uri: bridge_treatments:applied_treatments
    range: Treatment
    multivalued: true
  biological_context_id:
    name: biological_context_id
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/biological_context_id
    description: Unique identifier for the context. When the source assigns one (a
      ZFIN genotype ID, a germplasm accession ID, an opalplants PCG number), keep
      it; otherwise BRIDGE derives one on ingest.
    comments:
    - 'Not named id: reserved for reconciliation with the central schema''s NamedThing
      id slot (see module header).'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_biocontext:biological_context_id
    identifier: true
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: uriorcurie
    required: true
  full_name:
    name: full_name
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/full_name
    description: 'The one current full name for the context: a line name (RIL 407),
      a strain''s full designation, a taxon''s scientific name.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    exact_mappings:
    - alliance:agm_full_name
    close_mappings:
    - MIAPPE:biologicalMaterialId
    slot_uri: bridge_biocontext:full_name
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
  symbol:
    name: symbol
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/symbol
    description: The one current accepted symbol, e.g. CB1370 (a C. elegans strain)
      or a zebrafish genotype symbol.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    exact_mappings:
    - alliance:agm_symbol
    - biolink:symbol
    slot_uri: bridge_biocontext:symbol
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
  context_type:
    name: context_type
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/context_type
    description: Which kind of biological identity this row claims to be. Extends
      AGR's strain / genotype / fish subtype vocabulary with the MCPD infraspecific
      ranks MIAPPE uses for plants, with microbial and viral usage, and with taxon,
      population and community rows.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    aliases:
    - subtype
    close_mappings:
    - alliance:subtype
    slot_uri: bridge_biocontext:context_type
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: BiologicalContextTypeEnum
    required: true
  taxon:
    name: taxon
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/taxon
    description: 'Taxonomic classification as an NCBITaxon CURIE: the nearest existing
      taxon for a lineage row (species-level for plant cultivars, strain-level where
      NCBI has one), the taxon itself for a taxon row, a metagenome-style taxon for
      an environmental community.'
    comments:
    - Same pattern as nmdc:NcbiTaxon ids. Widen in lockstep (GTDB, LPSN, SeqCode)
      if those registries are admitted.
    - Expect asymmetry across kingdoms. Microbial strains often have their own NCBI
      taxid (E. coli K-12 MG1655, NCBITaxon:511145); plant cultivars never do - Ensembl
      Plants gives wheat Jagger the species taxid (4565), and every Phytozome pennycress
      accession carries the species-level 13288. On a plant lineage row this slot
      holds the nearest existing taxon, and the cultivar identity lives in this class,
      not in the taxonomy.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    close_mappings:
    - nmdc:classified_as
    - MIAPPE:organism
    slot_uri: bridge_biocontext:taxon
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: uriorcurie
    pattern: ^NCBITaxon:\d+$
  genus:
    name: genus
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/genus
    description: Genus part of the organism name, per standard nomenclature.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    exact_mappings:
    - MIAPPE:genus
    slot_uri: bridge_biocontext:genus
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
  species:
    name: species
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/species
    description: Specific epithet part of the organism name.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    exact_mappings:
    - MIAPPE:species
    slot_uri: bridge_biocontext:species
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
  synonyms:
    name: synonyms
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/synonyms
    description: Non-preferred names for the context, any type.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    exact_mappings:
    - alliance:agm_synonyms
    slot_uri: bridge_biocontext:synonyms
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
    multivalued: true
  secondary_identifiers:
    name: secondary_identifiers
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/secondary_identifiers
    description: Identifiers for the same entity in other collections (EBI BioSamples,
      germplasm databases, stock centers), and external ids a source carries for the
      record.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    exact_mappings:
    - alliance:agm_secondary_ids
    - MIAPPE:biologicalMaterialExtId
    slot_uri: bridge_biocontext:secondary_identifiers
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
    multivalued: true
  broader_context:
    name: broader_context
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/broader_context
    description: 'The less specific context this row specializes, when the broader
      identity is itself a BRIDGE row: a described genotype''s strain, a strain''s
      species row where a source keeps species rows. When the broader identity is
      exactly an NCBI taxon, populate taxon and leave this empty.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    aliases:
    - specializes
    slot_uri: bridge_biocontext:broader_context
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: BiologicalContext
  member_contexts:
    name: member_contexts
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/biological_context/member_contexts
    description: 'The known members of a community or population row: the strains
      of a defined SynCom, the taxa of an enrichment. Composition, not pedigree; measured
      community profiles are data, not catalog metadata, and do not go here.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    related_mappings:
    - RO:0002351
    slot_uri: bridge_biocontext:member_contexts
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
