classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/NamedThing
    description: Generic base for any identifiable BRIDGE entity.
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:Thing
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/Measurement
    description: One value of one property of one thing, as reported by a source.
      A measurement may carry a number with a unit, a range, a summary statistic,
      a categorical term, or only the source text, and it may say why no value is
      present. The 2026-09-30 hackathon chose to start with this single class and
      add an Observation class only when data shows a need for one.
    comments:
    - A measurement must carry at least one of raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, coded_value or missing_value_reason, so an empty measurement
      fails validation.
    - A measurement names its property with exactly one of observed_property (an identifier)
      or property_label (free text). property_label is the catch-all for values whose
      property has no identifier yet, as MIxS misc_param, NMDC PropertyAssertion and
      BERtron Attribute allow.
    - 'The value slots come in two groups. raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, unit and coded_value hold the value itself: raw_value
      as the source wrote it, the others as parsed from it (numeric_value for a number,
      coded_value for a category). comparator, statistic, standard_deviation, sample_size,
      value_role, value_qualifier and missing_value_reason say something about that
      value.'
    - A source cell that holds several values (for example a width and a length) becomes
      several measurements that share source_record_id and source_field.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - sosa:Observation
    - nmdc:QuantityValue
    slots:
    - measurement_id
    - Measurement_observed_property
    - property_label
    - feature_of_interest
    - Measurement_raw_value
    - numeric_value
    - minimum_numeric_value
    - maximum_numeric_value
    - unit
    - unit_basis
    - coded_value
    - comparator
    - statistic
    - standard_deviation
    - sample_size
    - value_role
    - value_qualifier
    - missing_value_reason
    - measurement_method
    - treatment
    - instrument
    - observed_time
    - observed_start_time
    - observed_end_time
    - source_system
    - source_record_id
    - source_field
    - quality_flag
    slot_usage:
      observed_property:
        name: observed_property
        recommended: true
      raw_value:
        name: raw_value
        recommended: true
    class_uri: bridge_central_schema:Measurement
    any_of:
    - slot_conditions:
        raw_value:
          name: raw_value
          required: true
    - slot_conditions:
        numeric_value:
          name: numeric_value
          required: true
    - slot_conditions:
        minimum_numeric_value:
          name: minimum_numeric_value
          required: true
    - slot_conditions:
        maximum_numeric_value:
          name: maximum_numeric_value
          required: true
    - slot_conditions:
        coded_value:
          name: coded_value
          required: true
    - slot_conditions:
        missing_value_reason:
          name: missing_value_reason
          required: true
    exactly_one_of:
    - slot_conditions:
        observed_property:
          name: observed_property
          required: true
    - slot_conditions:
        property_label:
          name: property_label
          required: true
  PhenotypicMeasurement:
    name: PhenotypicMeasurement
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/PhenotypicMeasurement
    description: 'A measurement of a phenotypic trait of an organism or observation
      unit: one trait value, produced by one method, at one time. Modeled on MIAPPE
      v1.2 Observed Variable (trait + method + scale) and on the ORNL APPL plant phenotyping
      exports, where one Observation row is one trait value from one imaging event.'
    comments:
    - 'Deliberately thin. Measurement already carries what phenotyping needs: the
      trait''s name goes in observed_property or property_label, the method in measurement_method,
      the summary in statistic, the image-QC state in quality_flag, missing values
      in missing_value_reason, and computed traits (pixel counts times a calibration
      scale, such as APPL''s millimetre areas) in value_role derived. Only the trait-ontology
      hooks are new.'
    - 'Phenotype versus measurement: a raw trait value (projected shoot area on one
      date, Fv/Fm from one fluorescence event) is a measurement and belongs here.
      An interpreted phenotype claim ("dwarf under high dose"), aggregated over many
      measurements, is a knowledge-level assertion and is deliberately NOT this class;
      value_role interpreted covers a single interpreted value, and a future Phenotype
      class referencing the measurements it derives from would cover the aggregate.
      Flagged as an open question on the genotype/strain straw person.'
    - QC values that describe the measuring process rather than the organism (for
      example APPL's fc1.mask_coverage_pct segmentation coverage) should be plain
      Measurements, not PhenotypicMeasurements, so trait tables are not polluted with
      instrument diagnostics.
    - 'A known APPL pitfall this model should not reproduce: events whose segmentation
      found no plant (empty_mask) store 0.0 instead of no value. Here that case keeps
      the source''s 0.0 in raw_value only, with missing_value_reason not_determined
      and quality_flag empty_mask, so no parsed numeric_value fabricates a size for
      a plant that was not seen.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    is_a: Measurement
    slots:
    - measurement_id
    - Measurement_observed_property
    - property_label
    - feature_of_interest
    - Measurement_raw_value
    - numeric_value
    - minimum_numeric_value
    - maximum_numeric_value
    - unit
    - unit_basis
    - coded_value
    - comparator
    - statistic
    - standard_deviation
    - sample_size
    - value_role
    - value_qualifier
    - missing_value_reason
    - measurement_method
    - treatment
    - instrument
    - observed_time
    - observed_start_time
    - observed_end_time
    - source_system
    - source_record_id
    - source_field
    - quality_flag
    - trait_term
    - trait_entity_term
    class_uri: bridge_central_schema:PhenotypicMeasurement
  Organism:
    name: Organism
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/genotype/Organism
    description: 'The biological identity of what is in a sample or observation unit:
      a living or once-living individual (or expected population of one taxon), not
      the physical sample itself. Several samples can share one organism, and several
      organisms can instantiate one GeneticModel.'
    comments:
    - 'nmdc:Organism carries strain_name and isolate_name as plain slots. Here that
      identity moves one hop away: an organism whose strain is known points at a GeneticModel
      of subtype strain. A source with only a species-level taxon populates taxon
      and leaves genetic_model empty.'
    - In the APPL/MIAPPE plant-phenotyping shape, the ObservationUnit (one pot-grown
      plant) is the individual; it maps here as an Organism whose genetic_model is
      the MIAPPE BiologicalMaterial line.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/genotype
    close_mappings:
    - nmdc:Organism
    - biolink:IndividualOrganism
    slots:
    - organism_id
    - organism_name
    - taxon
    - genus
    - species
    - genetic_model
    class_uri: bridge_genotype:Organism
  GeneticModel:
    name: GeneticModel
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/genotype/GeneticModel
    description: 'A named genetic entity that organisms instantiate: a strain, genotype,
      cultivar, accession, line, isolate, ecotype or variant. Covers AGR''s AffectedGenomicModel
      ("inbred strains, stocks, disease models and mutant genotypes") and MIAPPE''s
      BiologicalMaterial (germplasm accessions and named lines). The subtype slot
      says which kind of entity a record claims to be, because communities draw the
      strain/genotype line differently rather than because the distinction is crisp.'
    comments:
    - At least one of full_name or symbol must be populated (carried over from the
      AGR AffectedGenomicModel rule).
    - Strain versus genotype, as users mean them. A strain / line / cultivar / accession
      is a material lineage you can obtain and propagate (it has a stock center, a
      holding institute, parents). A genotype is a description of genetic composition
      (alleles, zygosity, background). A strain has a genotype; a genotype can be
      written down for an individual that belongs to no named lineage. Both NMDC and
      AGR collapsed the two in practice, and no current BER source records allele-level
      composition, so this straw person keeps one class with a subtype and leaves
      decomposition to has_genomic_components.
    - 'GENO (checked 2026-11-10) makes the same split and is upfront about it: GENO:0000536
      genotype is "a specification of the genetic state of an organism" (an information
      artifact), while GENO:0000112 strain or breed is "a maximal collection of organisms
      of a single species that have been bred or experimentally manipulated with the
      goal of being genetically identical" (a collection of material entities; GENO
      even notes that two colonies with the same genotype maintained in different
      labs are different strains). So no single GENO term covers this class; the subtype
      values carry the GENO meanings instead, and an ontologically strict future revision
      would split GeneticModel along exactly that line. GENO has no term for cultivar
      or botanical variety; those meanings come from EFO, NCIT and TAXRANK.'
    - 'Per-kingdom usage of subtype. Plants: cultivar, accession, line (RILs), variety,
      ecotype (MCPD ranks via MIAPPE infraspecificName). Animals: strain (mouse, rat),
      genotype (fish, fly). Microbes and fungi: strain, isolate; engineered strains
      are strains whose has_genomic_components lists the modifications; NCBI Taxonomy
      sometimes has strain-level taxa (e.g. E. coli K-12 MG1655, NCBITaxon:511145),
      in which case taxon points there and the species-level rollup comes from the
      taxonomy, not this schema. Viruses: variant, isolate.'
    - Lakehouse join points. has_genomic_components is the intended JGI connection
      (gene / transcript / allele CURIEs). EMSL MONet connects at study/project level
      only; nothing genotype-shaped exists there.
    - 'Survey of plant resources (2026-11-10; Gramene, TAIR, SorghumBase/ GRIN, Ensembl
      Plants, Phytozome/GOLD, ABRC, pennycress resources): none has a genotype entity.
      Allelic composition everywhere is an association (TAIR germplasm-to-allele rows
      carrying zygosity; Ensembl per-variant sample calls), which supports keeping
      GeneticModel name-level and deferring components. Two recurring splits this
      single class absorbs, recorded here so mappings stay honest: (1) the line versus
      the orderable stock (TAIR Germplasm vs Stock, ABRC stock records) - the stock
      side lands in the material_source_* block; (2) the line versus its genome assembly
      (Ensembl species databases, Phytozome genome releases, Gramene) - the assembly
      side lands in genome_assemblies. GOLD''s organism entity has a strain field
      and no cultivar field (cultivars go in strain), so GOLD organisms map to this
      class with subtype strain or cultivar as the source metadata indicates.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/genotype
    exact_mappings:
    - alliance:AffectedGenomicModel
    close_mappings:
    - MIAPPE:BiologicalMaterial
    slots:
    - genetic_model_id
    - full_name
    - symbol
    - subtype
    - taxon
    - synonyms
    - secondary_identifiers
    - parent_models
    - genetic_background
    - pedigree
    - mutagen
    - member_of_populations
    - genome_assemblies
    - has_genomic_components
    - material_source_accession_number
    - material_source_accession_name
    - material_source_institute_code
    - material_source_institute_name
    - material_source_doi
    - material_source_other_identifiers
    - genetic_model_description
    class_uri: bridge_genotype:GeneticModel
    any_of:
    - slot_conditions:
        full_name:
          name: full_name
          required: true
    - slot_conditions:
        symbol:
          name: symbol
          required: true
