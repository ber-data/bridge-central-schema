classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/NamedThing
    description: Generic base for any identifiable BRIDGE entity.
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:Thing
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/ber-data/bridge-measurements/Measurement
    description: One value of one property of one thing, as reported by a source.
      A measurement may carry a number with a unit, a range, a summary statistic,
      a categorical term, or only the source text, and it may say why no value is
      present. The 2026-09-30 hackathon chose to start with this single class and
      add an Observation class only when data shows a need for one.
    comments:
    - A record must carry at least one of raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, value_term or missing_value_reason, so an empty measurement
      fails validation.
    - A record names its property with exactly one of observed_property (an identifier)
      or property_label (free text). property_label is the catch-all for values whose
      property has no identifier yet, as MIxS misc_param, NMDC PropertyAssertion and
      BERtron Attribute allow.
    - A source cell that holds several values (for example a width and a length) becomes
      several Measurement records that share source_record_id and source_field.
    from_schema: https://w3id.org/ber-data/bridge-measurements
    close_mappings:
    - sosa:Observation
    - nmdc:QuantityValue
    slots:
    - measurement_id
    - Measurement_observed_property
    - property_label
    - feature_of_interest
    - Measurement_raw_value
    - numeric_value
    - minimum_numeric_value
    - maximum_numeric_value
    - unit
    - value_term
    - comparator
    - statistic
    - standard_deviation
    - sample_size
    - value_role
    - value_qualifier
    - missing_value_reason
    - measurement_method
    - instrument
    - observed_time
    - source_system
    - source_record_id
    - source_field
    - quality_flag
    slot_usage:
      observed_property:
        name: observed_property
        recommended: true
      raw_value:
        name: raw_value
        recommended: true
    class_uri: bridge:Measurement
    any_of:
    - slot_conditions:
        raw_value:
          name: raw_value
          required: true
    - slot_conditions:
        numeric_value:
          name: numeric_value
          required: true
    - slot_conditions:
        minimum_numeric_value:
          name: minimum_numeric_value
          required: true
    - slot_conditions:
        maximum_numeric_value:
          name: maximum_numeric_value
          required: true
    - slot_conditions:
        value_term:
          name: value_term
          required: true
    - slot_conditions:
        missing_value_reason:
          name: missing_value_reason
          required: true
    exactly_one_of:
    - slot_conditions:
        observed_property:
          name: observed_property
          required: true
    - slot_conditions:
        property_label:
          name: property_label
          required: true
